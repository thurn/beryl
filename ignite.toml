file = "engine/crates/beryl_kernel/src/counters.rs"
append = "\nconst _: () = ();\n"
products = ["clippy", "rust-tests"]

[[rebuild]]
name = "one-card"
edit = "append a no-op item to one card file"
file = "engine/cards/cards_1993/lea/animate_dead.rs"
append = "\nconst _: () = ();\n"
products = ["clippy", "rust-tests"]

[[rebuild]]
name = "client-prompt-body"
