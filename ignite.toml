# Ignite's configuration for this repository: what Ignite knows about the repository it delivers
# to and the machines that serve it. Check families and build products are in ignite/checks/.
# See docs/ignite.md.

[repository]
remote = "origin"
# Ignite's own refs live under `refs/ignite/` on the remote, not under `refs/heads/`, so GitHub
# lists `master` as the repository's only branch. A fetch copies them to `origin/ignite/staging`
# and so on, and the main checkout keeps a local branch `staging` at `refs/ignite/staging`
# (`ignite_core::refname`). The integration ref every landing pushes to.
staging = "refs/ignite/staging"
master = "master"
# Daemons build Ignite from this ref, not from `master`. A landing that changes Ignite moves it
# once the `ignite` family passes there, so an Ignite fix deploys without waiting for tip
# verification of everything else, which an Ignite bug can itself block. A push by hand deploys
# too: daemons poll it every five minutes. Older daemons that refused unknown keys must not read
# this; every daemon has run a build that only warns since 506508f9a.
release = "refs/ignite/release"
release_family = "ignite"
trees = ".worktrees"
checks = "ignite/checks"
# The newest tip whose build checks (the families declared `builds = true`) passed. `ignite start`
# and `ignite sync` begin there instead of at the tip, so a tip that does not compile never
# reaches a new ticket; a tip round moves it (docs/ignite.md, "Tip verification"). The first round
# whose build checks pass creates the ref by pushing; until then `ignite start` uses the tip.
green = "refs/ignite/green"
# `ignite release` pushes a released ticket's work to this prefix followed by the ticket's ID, and
# the next `ignite start` of the ticket checks it out (docs/ignite.md, "Releasing work").
saved = "refs/ignite/tickets/"

# Paths that count as test files when Ignite classifies a landed check fix.
# Card and rules definitions and the oracle scenario sources and data count as product code.
test_paths = [
  "**/tests/**",                  # Integration tests and their fixtures and expected outputs.
  "**/*_tests.rs",                # Rust unit tests in sibling modules.
  "**/tests.rs",                  # Rust unit tests in a standalone tests module.
  "ui/**/*.test.ts",              # TypeScript unit tests.
  "ui/**/*.test.tsx",             # TypeScript unit tests for React components.
  "tools/tests/**",               # Python tests and fixtures.
  "ui/fixtures.json",             # Saved game setups used by the UI and spec checks.
  "ui/shots.json",                # Screens and assertions exercised by the UI checks.
  "data/beryl3d/timeline/web/**", # Expected UI timelines captured from the web client.
  "ignite/checks/**",             # Check family declarations and commands.
]

# Express landings (docs/ignite.md, "Express landings"). On 2026-11-18 every fix to Ignite's own
# scheduling waited 10 to 30 minutes for `ignite land` in the queue it was fixing, and three were
# pushed to the release ref (`repository.release`) by hand instead. A landing whose every changed
# file matches `paths` runs these commands in its own ticket tree, side by side with others, on
# reserved express cores. When the commands pass, Ignite pushes and moves the release ref.
# The commands are those of the `ignite` and `ignite-lint` families (ignite/checks/rest.toml):
# the whole workspace's tests, because `cargo test -p ignite_daemon` alone once missed a failing
# test in `ignite_core`. They run under cargo-nextest, which runs every test binary at once and
# reads its thread count from the `NEXTEST_TEST_THREADS` the daemon sets; `cargo test` ran the
# binaries one after another. Ignite's test build is about 56 CPU-seconds with the tree's target
# directory warm.
#
# `families` are the check families the commands stand in for. `ignite test` of names only in
# them (`ignite test ignite: ignite-lint:`), and `ignite check`, run the commands in the agent's
# own tree on the same cores when the tree changes only `paths`. On
# 2026-11-18 `ignite test` of these checks took 5 to 8.5 minutes through the scheduler while Beryl
# builds held its cores, against about a minute when it got them.
[express]
paths = ["ignite/**", "ignite.toml", "docs/ignite.md", "data/efficiency-changes.json", ".agents/skills/cifix/SKILL.md"]
tree = ".worktrees/express" # unused since express landings run in their own trees; kept for older daemons
dir = "ignite"
commands = [
  # The formatting checks come first, because they take a second or so and the commands after
  # them take 90 to 140 s under load: a misformatted file must cost seconds, not a whole run.
  "cargo fmt --check",
  # Every Markdown file under the express paths (`docs/ignite.md` and `ignite/**/*.md`), checked
  # as the landing's Markdown rule in `[format]` formats it (`just fmt`, 80 columns), so a pass
  # here means the landing's formatters change nothing. The command is split on whitespace and
  # run without a shell, so the pattern is unquoted; `target` holds build output, not sources.
  "uv run --quiet --project ../tools mdformat --check --exclude target/** ../docs/ignite.md .",
  # `--jobs default` (and `--build-jobs default` below) compile on as many jobs as the machine
  # has cores, whatever the `CARGO_BUILD_JOBS` the daemon sets from the express cores. Every
  # process runs at the same priority, so under load a build gets CPU in proportion to its jobs;
  # priority is no lever, since the commands run at `nice 10` were no slower. On multivac (10
  # cores) on 2026-11-19, at a load average of 50 to 110, after an edit to `ignite_core` the
  # test build took 31 to 43 s on 2 jobs and 24 to 27 s on 10, and clippy 8 to 9 s and 6 to 7 s.
  # After an edit to one daemon file only that crate rebuilds, and 2 or 10 jobs made no
  # difference: all four commands took 32 to 37 s. Builds stay current across the flags.
  "cargo clippy --locked --all-targets --jobs default -- -D warnings",
  # The `express` profile (ignite/.config/nextest.toml) kills a test after 120 s, so a hung test
  # fails in about two minutes with its name instead of holding the landing to the verb limit.
  # It also leaves out the few tests that take over 3 s, which the `ignite` family runs in tip
  # verification: with them the test run took 90 to 96 s under load whatever the thread count.
  # `--test-threads=num-cpus` runs as many tests at once as the machine has cores, whatever the
  # `NEXTEST_TEST_THREADS` the daemon sets from the express cores: the tests mostly wait for the
  # processes and `git` commands they start, so threads beyond the cores cost little CPU. On
  # 2026-11-19, at a load average of 15 to 23 on 18 cores, the run took 56 to 82 s on 3 threads,
  # 37 to 72 s on 6, 14 to 17 s on 12 and 12 s on 18.
  "cargo nextest run --locked --cargo-quiet --workspace --profile express --build-jobs default --test-threads=num-cpus --status-level=fail --final-status-level=fail",
]
families = ["ignite", "ignite-lint"]
# Files no express command builds or runs: the design document, which the Markdown check only
# checks the formatting of after the landing's formatters rewrote it, the efficiency log, and
# the Ignite check repair skill. Nearly every Ignite change edits the design or log, so a landing
# that rebases over another Ignite change finds them shared. Without this list it ran all four commands
# again (65 to 71 s on 2026-11-19). A commit landed meanwhile that edits one of them leaves an
# earlier pass standing; a shared file under `dir` still runs the commands again.
inert = ["docs/ignite.md", "data/efficiency-changes.json", ".agents/skills/cifix/SKILL.md"]

# Formatters `ignite land` runs on the files a landing changes, before the gate or the express
# commands, committing what they change as `style: format` (docs/ignite.md, "Formatting at
# landing"). On 2026-11-18 formatting failures found by the checks cost workers on one epic about
# 25 minutes, one round trip at a time. The commands are those of `just fmt`; `{files}` is the
# changed files a rule matches, relative to its `dir`. A rule whose formatter is missing from a
# tree (no `ui/node_modules`) gives a warning and the landing goes on.
[format]
rules = [
  { paths = ["ignite/**/*.rs"], dir = "ignite", command = "cargo fmt" },
  # `cargo fmt` does not reach the card files, whose `mod` lines a build script writes, so the
  # files are named directly, as `beryl_tools.card_files rustfmt` does.
  { paths = ["rust/**/*.rs"], dir = "rust", command = "rustfmt --edition 2024 {files}" },
  { paths = ["**/*.md"], exclude = [".agents/**"], command = "uv run --quiet --project tools mdformat {files}" },
  { paths = ["tools/**/*.py", "efficiency/**/*.py"], command = "uv run --quiet --project tools black --quiet {files}" },
  { paths = ["ui/**"], dir = "ui", command = "node_modules/.bin/prettier --write --log-level warn --ignore-unknown {files}" },
  { paths = ["justfile"], command = "just --fmt --unstable" },
]

# When a daemon restarts into a new release (docs/ignite.md, "Processes"). On 2026-11-18 the
# daemon on jarvis restarted 16 times between 20:28 and 22:11 PST, once per landed release that
# changed its code, and each restart reran every `ignite start` in progress. A restart now waits
# while a landing runs or a newer release builds, and until no newer release has appeared for
# `quiet_seconds`. Releases come from landings, so the landing hold already merges releases that
# land one after another; the quiet window only covers a release pushed by hand. It was 90 s
# until 2026-11-19, when it set the floor of every `ignite wait deploy-<commit>`: a lone Ignite
# landing waited 100 to 110 s for a build that had finished in 40 s. `cap_seconds` bounds the
# wait from the first pending release, which the daemon records when it starts the release's
# build. It was 600 s until 2026-11-19, when landings ran almost all the time: 4 of 15 restarts
# on jarvis waited out the whole cap and the median release reached jarvis 395 s after it moved.
# At 30 s the build (about 40 s on the express cores) outlasts the cap, so the restart follows
# the build. A landing it cuts short runs again under the new build, and loses little: its
# express tree's Cargo target directory is warm and a finished express pass is remembered.
# `quiet_seconds` was 15 until 2026-11-19, when express landings began to build their release
# before landing: the release then needs only its selftest, a few seconds, and the quiet window
# was the rest of the wait.
# How a change that touches none of Ignite's own source lands (docs/ignite.md, "Landing"). On
# 2026-11-19 the median landing through the gate took 7.8 minutes and the slowest 91 minutes over
# 7 passes: each time another landing moved the tip, the landing rebased, rebuilt what had landed
# and gated again, and none of the 23 passes lost that way found a failure. In `verdict` mode the
# gate's pass on the change's own base is stored, and the landing rebases onto the tip in git's
# object database and pushes without checking again. A base more than `max_base_age_hours` old is
# rebased for real first, so a verdict never rests on code half a day older than the tip.
# `mode = "strict"` restores checking on the exact tip.
[land]
  mode = "verdict"
  max_base_age_hours = 12

# Landing by verdict can leave a tip that does not compile: two changes that each build alone.
# Until it is fixed `green` cannot move and later landings pile onto it, and a fix written by an
# agent takes tens of minutes, so a tip round reverts the one landing that broke a build check.
# Every other failing check is fixed forward through a regression ticket (docs/ignite.md, "A
# broken build is reverted").
[revert]
broken_build = true

[self_update]
quiet_seconds = 5
cap_seconds = 30

[hub]
url = "https://jarvis.tail4b0774.ts.net:8443"
project = "by"
# The dashboard is at the hub's root; only the API is under /by/api. The old dashboard also
# answered at /beryl/, and page addresses under /by/ and /beryl/ redirect to the root.
aliases = ["beryl"]
# Shown at the left of every dashboard page's header in place of the name "Ignite". The hub reads
# it when it starts, so a change shows after the hub's next restart.
wordmark = "ignite/wordmark.html"

# The landing gate (docs/ignite.md, "Where regression checks run"). The threshold is from
# `ignite gate replay` over the 14 days of history before 2026-11-18: it kept 6066 of the 6383
# catches in that history. `seconds` is the first budget: seconds of running checks chosen by
# score, at the rate the hub measures for `land`-class check commands, builds not counted.
[gate]
threshold = 2.85e-4 # expected failures per billion instructions
seconds = 60        # of running checks per landing

# Improvement rules (docs/ignite.md, "Improvement tickets"). A report-only rule files nothing.
# Set the Efficiency improvements allocation on the dashboard's Pool page to manage dispatch.
# Upkeep leaves protected checks on when it files a remedy. The never-caught rule skips them.
# The oracle families play product scenarios against independent rules engines.
[rules]
report_only = ["tier-gap"]
protected = ["app", "ui-smoke", "clippy", "pyre", "ui-types", "source", "oracle", "oracle-generated"]

# A ticket's `effort:` label overrides this default. Apps without an entry use medium.
[pool.default_effort]
codex = "high"

# The model ID each provider accepts for each `tier:` label. Update the IDs here when
# a new model is released; tier labels on tickets do not change.
[pool.models.claude]
opus = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"
light = "claude-sonnet-5-5"

# Codex runs every tier on GPT-6.2 Sol.
[pool.models.codex]
opus = "gpt-6.2-sol"
sonnet = "gpt-6.2-sol"
light = "gpt-6.2-sol"

# Antigravity CLI (`agy`) splits Gemini and Claude into separate providers because
# they draw from independent quota pools.
[pool.models.agy-gemini]
opus = "gemini-4-neon"
sonnet = "gemini-4-neon"
light = "gemini-3.8-flash"

[pool.models.agy-claude]
opus = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"
light = "claude-sonnet-5-5"

# The daemon runs each worker turn with the configured program and CLI adapter. Set
# `dialect` when the provider name differs from the adapter name. See "CLI mode" in docs/ignite.md.
[pool.cli.claude]
program = "claude"
args = ["--dangerously-skip-permissions"]

[pool.cli.codex]
program = "codex"
# Playwright's separate service can still be starting when Ignite probes after a reboot.
args = ["--dangerously-bypass-approvals-and-sandbox", "-c", "mcp_servers.playwright.required=false"]

[pool.cli.agy-gemini]
program = "agy"
dialect = "agy"
args = ["--dangerously-skip-permissions"]

[pool.cli.agy-claude]
program = "agy"
dialect = "agy"
args = ["--dangerously-skip-permissions"]

# Tip verification (docs/ignite.md, "How long a round takes"). A claim holds about this many CPU
# seconds of recorded check costs, so a family of thousands of cheap checks is a few commands
# instead of one command per 50 checks. `seconds` is the second budget: seconds of running the
# best-scored checks, at the rate the hub measures for `tip`-class check commands, before
# `master` moves to the tip; the rest run afterwards.
[tip]
claim_seconds = 60
seconds = 300

# Headless WebKit runs at a higher priority than builds, so limit pages across all trees to
# half the logical cores on machines that run browser checks.
[resources.browser-pages]
per_core = 0.5

# The Mac Studio that runs the hub.
[machine.jarvis]
os = "macos"

[machine.jarvis.resources]
oracle = 1
bench-vm = 1

# The MacBook Pro.
[machine.multivac]
os = "macos"

[machine.multivac.resources]
oracle = 1

# The Windows PC (12 cores, 20 threads, 32 GB) with a 128 GB Dev Drive (ReFS) at D:.
# The browser and app families require the Mac's WebKit or desktop runtime.
# Oracle checks use the pinned JDK and Maven builds from `just oracle-setup`.
# Rollout counts use the `beryl-bench` WSL distribution from `just bench-count`.
# Frame instruction counts use the `beryl3d-bench` WSL distribution from `just b3d vm`.
#
# `families` holds those verified on cygnus. Pytest and the browser-free UI checks run
# natively, and Pyre uses WSL.
# `ignite-platform` must pass on Windows. Cygnus is the only Windows machine, so it must be
# listed here: without it every tip waits on its Windows checks and `master` never moves.
[machine.cygnus]
os = "windows"
families = [
  "rust", "doctests", "clippy", "rust-format", "ignite", "ignite-lint", "source", "markdown",
  "repository", "commit", "black", "pytest", "pyre", "b3d-format", "b3d-source", "ignite-platform",
  "counts", "allocations", "card-text", "script", "scale", "iroh", "fuzz", "exhaust",
  "oracle", "oracle-generated", "ui-format", "ui-types", "ui-unit",
  "b3d-clippy", "b3d-validation", "b3d-test", "b3d-interface", "b3d-every-tick", "b3d-corpus",
  "b3d-gate", "b3d-frame-counts", "b3d-frame-trend",
]

[machine.cygnus.resources]
bench-vm = 1
oracle = 1

[[rebuild]]
name = "kernel-body"
edit = "append a no-op item to a module of beryl_kernel"
file = "rust/crates/beryl_kernel/src/counters.rs"
append = "\nconst _: () = ();\n"
products = ["clippy", "rust-tests"]

[[rebuild]]
name = "one-card"
edit = "append a no-op item to one card file"
file = "rust/cards/cards_1993/lea/animate_dead.rs"
append = "\nconst _: () = ();\n"
products = ["clippy", "rust-tests"]

[[rebuild]]
name = "b3d-prompt-body"
edit = "append a no-op item to the Beryl 3D prompt bar module"
file = "rust/beryl3d/crates/game_hud/src/prompts/bar/view.rs"
append = "\nconst _: () = ();\n"
products = ["b3d"]

[[rebuild]]
name = "b3d-widget-body"
edit = "append a no-op item to the Beryl 3D button widget module"
file = "rust/beryl3d/crates/kit_ui/src/widgets/button.rs"
append = "\nconst _: () = ();\n"
products = ["b3d"]

[[rebuild]]
name = "b3d-table-body"
edit = "append a no-op item to the Beryl 3D battlefield rows module"
file = "rust/beryl3d/crates/game_table/src/table/rows.rs"
append = "\nconst _: () = ();\n"
products = ["b3d"]

[[rebuild]]
name = "b3d-flat-tuning"
edit = "append JSON whitespace to the bundled Beryl 3D flat-layer tuning"
file = "data/beryl3d/flat.json"
append = "\n"
products = ["b3d"]

# The efficiency dashboard's commands. Each daemon runs them when the session transcripts grow and
# posts the export to the hub (docs/ignite.md, "Records and metrics").
[metrics]
watch = ["~/.claude/projects", "~/.codex/sessions", "~/.gemini/antigravity-cli/brain"]
ingest = ["just", "efficiency", "ingest"]
export = ["just", "efficiency", "export", "--no-ingest", "--since", "{since}", "--out", "{out}"]
findings = ["just", "efficiency", "findings", "--no-ingest", "--json"]
# Each ticket window's time and dollar segments for the efficiency section of ticket pages.
spend = ["just", "efficiency", "spend", "--no-ingest", "--since", "{since}", "--out", "{out}"]
