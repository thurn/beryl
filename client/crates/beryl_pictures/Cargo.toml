[package]
name = "beryl_pictures"
version = "0.1.0"
description = "The client's pictures: draws moments of a recording offscreen with the renderer"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `just client png` and `film`. This crate links no engine, cards or search (no `beryl_session`), so
# that after an edit to the client the program relinks and starts as fast as `client` does
# (docs/beryl-3d.md, "Edit-to-output time").
[[bin]]
name = "client-render"
path = "src/main.rs"

[dependencies]
kit_base.workspace = true
kit_scene.workspace = true
kit_frame.workspace = true
kit_probe.workspace = true
kit_ui.workspace = true
# Writes a picture as a PNG.
beryl_render = { path = "../beryl_render" }
# `Headless`, which plays a recording through the test driver and draws its frames offscreen.
beryl_host = { path = "../beryl_host", features = ["headless"] }
# The recordings pack and the option parser the text commands use.
beryl_inspect = { path = "../beryl_inspect" }
game_probe.workspace = true
[dev-dependencies]
# Supplies the atlas format and rasterization counters for rendering tests.
beryl_assets = { path = "../beryl_assets" }
# Builds card transforms in the rendering tests.
glam.workspace = true
# Supplies the table camera and JSON output for the frame measurement examples.
game_table.workspace = true
serde_json.workspace = true
app_client.workspace = true
# The seat a recording is seen from.
beryl_protocol = { path = "../../../engine/crates/beryl_protocol" }
# Reads the stories the picture tests draw and records their paths for Ignite.
beryl_test_files = { path = "../../../engine/crates/beryl_test_files" }
