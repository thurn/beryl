[package]
name = "beryl_client"
version = "0.1.0"
description = "The client's client: the crates that make up the native 3D app"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# The phones build this crate's library as a static library for iOS and a shared library for
# Android (`cargo rustc --lib --crate-type staticlib` or `cdylib`, in `just client ios-smoke` and
# `android-smoke`), so that a desktop build links neither. Their hosts call the C functions in
# src/ffi, declared in include/beryl_client.h.

[[bin]]
name = "beryl"
path = "src/main.rs"

[features]
# What only a debug build has: `--fixture`, which replays a recording from the recordings pack
# instead of playing a game, `--pause-at`, `--drive`, `--load`, `--slow-gpu`, and `--agent`
# with its `--opponent`, `--seed` and `--search-class`, and the testing screen's card playground,
# with every card's scenarios. A release build leaves it off, and with it the pack.
tools = [
    "dep:beryl_inspect",
    "beryl_host/drive",
    "beryl_host/headless",
    "dep:socket2",
    "dep:beryl_cli",
    "beryl_cards/scenarios",
]

[dependencies]
app_client.workspace = true
app_screens.workspace = true
game_manual.workspace = true
game_play.workspace = true
kit_base.workspace = true
kit_frame.workspace = true
kit_probe.workspace = true
kit_ui.workspace = true
beryl_assets = { path = "../beryl_assets" }
beryl_host = { path = "../beryl_host" }
beryl_inspect = { path = "../beryl_inspect", optional = true }
# The card playground of the tools build (`beryl_cli::specs::playground`): each card's examples,
# set up from its scenarios and played against an automated opponent. It replaces the browser
# server that fed the web app's playground page.
beryl_cli = { path = "../../../engine/crates/beryl_cli", optional = true }
beryl_render = { path = "../beryl_render" }
game_probe.workspace = true
# The decklist of a game `--agent` starts, as the web app's session deals it. The session
# already depends on it.
beryl_cards = { path = "../../../engine/crates/beryl_cards" }
# The position of a pointer event from a phone's host, as the client's vectors. The release
# app_client already depends on.
glam = "0.34.3"
# The agents `--offer` puts first on the start screen's list, which the session's list leaves
# out (`expert` is retired from it). It replaces nothing: beryl_session already depends on it.
beryl_search = { path = "../../../engine/crates/beryl_search" }
# The game the app plays: `Sessions` on the session thread.
beryl_session = { path = "../../../engine/crates/beryl_session" }
# The manual table's session, including its encrypted internet and localhost connections.
beryl_table_session = { path = "../../../engine/crates/beryl_table_session", features = ["iroh"] }
# The lobby request the session thread hands the manual table. It replaces nothing: app_client
# and beryl_session already depend on it.
beryl_protocol = { path = "../../../engine/crates/beryl_protocol" }
# The web app's data folders, so that both apps share replays, the ledger and bug reports.
beryl_shell = { path = "../../../engine/crates/beryl_shell" }
# Receives wgpu's warnings on a phone, which shows no standard error, and writes them to a file
# (src/ffi). The release wgpu already depends on.
log = { version = "0.4.35", features = ["std"] }
# The frame log's lines, in place of a hand-written JSON writer and reader.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Decodes the sounds and plays them on the audio device, in place of the web interface's Web
# Audio (src/audio.rs). `wav` decodes the effects (WAV files) and `mp4` the music (AAC in M4A
# files), both through Symphonia. `playback` (the output device, through cpal) is added below
# for every platform but Android, where cpal would link AAudio, which API levels 24 and 25 lack.
rodio = { version = "0.23.0", default-features = false, features = ["wav", "mp4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp4"] }

# The Kotlin host's strings and Surface, in place of hand-written JNI and NDK declarations. The
# releases wgpu already links on Android.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3.1"
ndk-sys = "0.6.0"

[target.'cfg(windows)'.dependencies]
# The debug app's local Unix socket, which the Windows Rust standard library does not expose.
socket2 = { version = "0.6.5", optional = true }
# Samples CPU utilization for frame logs in place of hand-written Win32 declarations.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
# Compiles tests/c/header.c, the C program that tests include/beryl_client.h, for the test targets
# only, in place of invoking the system's C compiler by hand. The release already in Cargo.lock.
cc = "1.11.2"

[dev-dependencies]
# Opens repository files and records each read, so Ignite reruns the tests when one changes.
beryl_test_files = { path = "../../../engine/crates/beryl_test_files" }
# The crate itself with `tools`, so that its tests and the binary they run can replay fixtures.
beryl_client = { path = ".", features = ["tools"] }
# Give live table tests separate, temporary host and guest profiles.
tempfile = "3"
