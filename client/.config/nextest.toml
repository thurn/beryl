# The fast check's `cargo-test` step (tools/src/beryl_tools/client/test_fit.py): each test's
# outcome and time as JUnit XML, which the run log reads, as the main workspace's profile does.
[profile.check.junit]
path = "junit.xml"

# Ignite's `client-test` family (ignite/checks/client.toml): the same JUnit report in its own
# directory, target/nextest/ignite/junit.xml, so that a run of it never overwrites the step's.
[profile.ignite.junit]
path = "junit.xml"

# These replays can use the whole grant or retain many frames. Running several at once exhausted
# memory on the Windows verifier while it was also serving other checks.
[[profile.ignite.overrides]]
platform = 'cfg(windows)'
filter = """
test(=differential::the_check_times_find_every_planted_fault) |
test(=recorded::every_recorded_script_finds_what_its_steps_name) |
test(=recorded::verbs_zones_passes_every_check_on_every_tick) |
test(=specs::every_card_spec_moment_opens_and_plays_to_its_end) |
test(/^light::every_arrow_line_and_fight_mark_the_tree_lists_is_drawn_/)
"""
threads-required = "num-test-threads"
