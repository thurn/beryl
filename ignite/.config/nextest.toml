# The profiles for nextest runs of Ignite's workspace: `express` for the express lane's command in
# ignite.toml, and `ignite` for the `ignite` family in ignite/checks/rest.toml, which tip
# verification and the gate run. A test that runs past `period` is reported slow, and one that
# runs past `period` times `terminate-after` (120 s) is killed and fails with its name. On
# 2026-11-18 one hung test held an express landing for the whole 1800 s verb limit.
#
# Measured on 2026-11-18 with `cargo nextest run --workspace` at a load average of 12 to 16 (1454
# tests, 43 s in all): the slowest test took 15 s and one more took 20 s, so 120 s is six times
# the slowest run seen and still ends a hang in about two minutes.
[profile.ignite.slow-timeout]
period = "30s"
terminate-after = 4

# The tests of `ignite_daemon`'s tree manager (`trees::`) build git repositories and lease
# worktrees, so nearly all their time is spent in git subprocesses, which are slow on Windows. On
# cygnus (20 cores), with a tip round compiling the Rust workspace on 13 to 17 of its 18 granted
# cores, these tests ran past 120 s in two gates in a row: once one test, then about 20 at once
# at 150 s. The slowest of them took 6 s alone there and 25 s in a full workspace run, so they
# were slow, not hung. A timeout may only catch a hang, so they get ten minutes, which still
# ends a hang with its name well inside the express lane's 1800 s verb limit. On jarvis each
# takes 1 to 2 s. Overrides belong to one profile, so `express` repeats this one below.

[[profile.ignite.overrides]]
filter = "(binary_id(ignite_daemon) & test(/^trees::/)) | binary_id(ignite_git::trees)"
slow-timeout = { period = "60s", terminate-after = 10 }

# On Windows, `about_one_hit_in_two_hundred_is_sampled_and_audited_in_idle_time` takes ~65 s alone
# and exceeds 120 s under parallel test load across 8,000 `idle.hit` calls. A timeout only catches
# a hang, so give it ten minutes here and in `express` below.
[[profile.ignite.overrides]]
filter = "binary_id(ignite_daemon) & test(=idle::tests::about_one_hit_in_two_hundred_is_sampled_and_audited_in_idle_time)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The express lane leaves out the tests that took over 3 s each. On 2026-11-19, at a load average
# of about 20, the workspace's 1638 tests took 257 s on one thread, and these ten took 121 s of
# it; the build through the wrapper alone took 51 s. With them, the test run took 90 to 96 s on 3
# or 12 threads, at least as long as the slowest; without them, 14 to 17 s on 12. The `ignite` family still runs every one of them, in
# tip verification and in the gate of any landing that is not express, so a change that breaks
# one is caught there before `master` moves. A new slow test belongs here too.
#
# Later on 2026-11-19, at a load average of 46 to 62, the express run took 26 to 61 s, and three
# more tests were always the slowest: the two `supervise::grants` tests that drive a Cargo
# stand-in through a growing and shrinking grant (20 to 58 s each) and the install handoff test
# (13 to 25 s, although it takes under a second alone, because it waits for macOS to check the
# new script it runs behind every other test's new executables). Without them the run took 18 to
# 19 s at a load average of 32 to 40, and 36 s at 46.
[profile.express]
default-filter = """
not (
  (binary_id(ignite_cli::integration) & (
    test(/^wrap::/)
    | test(/^end_to_end::/)
    | test(=adopt::a_command_in_a_tree_reset_at_start_is_ended_and_not_taken_over)
    | test(=supervise::a_command_past_its_hang_limit_is_ended_and_reads_as_hung)
    | test(=restart::a_restart_under_load_ends_no_command_and_runs_nothing_twice)
    | test(=supervise::grants::a_cargo_build_takes_job_slots_as_its_grant_grows_and_shrinks_for_a_landing)
    | test(=supervise::grants::cargo_inside_a_script_takes_job_slots_as_the_grant_grows)
  ))
  | (binary_id(ignite_daemon) & (
    test(=trees::tests::the_main_checkout_is_left_alone_while_it_has_a_local_change)
    | test(=trees::tests::setup_frees_a_landing_tree_left_landing_by_a_stopped_daemon)
    | test(=update::install::tests::the_process_handoff_runs_install_in_the_stored_build)
    | test(=idle::tests::about_one_hit_in_two_hundred_is_sampled_and_audited_in_idle_time)
  ))
)
"""

[profile.express.slow-timeout]
period = "30s"
terminate-after = 4

# The tree manager's tests and `about_one_hit_in_two_hundred_is_sampled_and_audited_in_idle_time`
# get ten minutes here too, as in the `ignite` profile above.
[[profile.express.overrides]]
filter = "(binary_id(ignite_daemon) & test(/^trees::/)) | binary_id(ignite_git::trees)"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.express.overrides]]
filter = "binary_id(ignite_daemon) & test(=idle::tests::about_one_hit_in_two_hundred_is_sampled_and_audited_in_idle_time)"
slow-timeout = { period = "60s", terminate-after = 10 }
