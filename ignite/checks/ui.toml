# The UI's checks that need no browser. The adapter is ui/scripts/ignite-checks.mjs.
# Formatting and types are in the always set (docs/ignite.md, "The always set").

[product.ui-deps]
build = "node scripts/npm-ci.mjs"
dir = "ui"
inputs = ["ui/package-lock.json", "ui/package.json", "ui/scripts/npm-ci.mjs"]
outputs = ["ui/node_modules"]

[family.ui-format]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["ui-deps"]
always = true
list = "node ui/scripts/ignite-checks.mjs ui-format --list"
run = "node ui/scripts/ignite-checks.mjs ui-format {checks}"
# prettier, run in ui/, also honors the repository's root .editorconfig.
inputs = ["ui/**", "ui/scripts/ignite-checks.mjs", ".editorconfig"]

[family.ui-types]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["ui-deps"]
always = true
# A build check: a failure means the code does not type-check, so `green` does not move.
builds = true
list = "node ui/scripts/ignite-checks.mjs ui-types --list"
run = "node ui/scripts/ignite-checks.mjs ui-types {checks}"
inputs = [
    "ui/src/**",
    "ui/tsconfig.json",
    "ui/vite.config.ts",
    "ui/package.json",
    "ui/scripts/ignite-checks.mjs",
    # tsc follows src/ imports into these (resolveJsonModule): src/stage/timing.ts and
    # src/table/commands.ts.
    "data/ui-conventions.json",
    "data/table-commands.json",
]

# One check per ui/scripts/*.test.mjs. A test may read more than ui/; the adapter follows each
# test's imports (ui/scripts/test-inputs.mjs) and lists the files it reaches outside ui/ as the
# check's own inputs.
[family.ui-unit]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["ui-deps"]
list = "node ui/scripts/ignite-checks.mjs ui-unit --list"
run = "node ui/scripts/ignite-checks.mjs ui-unit {checks}"
inputs = [
    "ui/src/**",
    "ui/scripts/**",
    "ui/*.json",
    "ui/package.json",
]
