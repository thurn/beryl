# One check per fixture of data/ui-counts.json: the work the UI does to play it in each layout
# there (React components rendered, DOM mutations, elements restyled and laid out), counted on
# Playwright's paused clock one frame at a time and held to its limits within their tolerance.
# The counts do not depend on the machine's speed or load, so the file's 3% tolerance sits just
# above their run-to-run noise, which is under 1%. A drop past the tolerance passes and asks for
# lower limits (`just ui-counts --update`).
[family.ui-counts]
kind = "regression"
adapter = "jsonl"
platforms = ["macos"]
needs = ["cli", "ui-deps"]
resources = ["browser-pages"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.browser list ui-counts"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.browser run ui-counts {checks}"
inputs = [
  "ui/src/**",
  "ui/index.html",
  "ui/vite.config.ts",
  "ui/package.json",
  "ui/public/**",
  "ui/fixtures.json",
  "data/ui-counts.json",
  "ui/scripts/counts.mjs",
  "ui/scripts/fixture-views.mjs",
  "ui/scripts/hang.mjs",
  "ui/scripts/moments.mjs",
  "ui/scripts/slots.mjs",
  "crate:beryl_cli_main",
  "tools/src/beryl_tools/ignite/browser.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/conventions.py",
  "tools/src/beryl_tools/motion_measure.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/suites.py",
  "tools/src/beryl_tools/system.py",
  "tools/src/beryl_tools/video.py",
  "tools/src/beryl_tools/video_measure.py",
  "tools/src/beryl_tools/video_shape.py",
]
