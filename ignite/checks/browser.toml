# The browser check families, which play the UI headless against recorded game fixtures. Their
# adapter is tools/src/beryl_tools/ignite/browser.py: it records the fixtures, serves ui/ with
# Vite and runs the scripts in ui/scripts/, which print their checks with `--list` and write
# Ignite's result lines when `IGNITE_RESULTS` is set (`recordResult` in ui/scripts/capture.mjs).
# See docs/ignite.md, "Declaring a family".
#
# Every family needs a pass on macOS: the checks play the app's webview engine, WebKit on macOS,
# and the ui-counts limits and the motion values are measured there. Each takes the
# `browser-pages` resource, which replaces the page slots of ui/scripts/slots.mjs. The
# `ui-deps` product is declared in ui.toml, and `cli` (the `beryl_cli` that records the game
# fixtures) in rust.toml.
#
# Waits in the `tip` and `idle` classes: Ignite passes each command its class as `IGNITE_CLASS`,
# and outside the landing gate a check may get few cores. A shot that takes 2 s once ran past
# Playwright's 30 s wait on a loaded machine, passed on its rerun and was filed as flaky; under
# Ignite a check that flakes twice is switched off. So for `tip` and `idle` the adapter sets
# `BERYL_LOW_PRIORITY=1`, which makes every wait three minutes (`WAIT_MS` in ui/scripts/hang.mjs).

# The game screen played headless: one check per kept check of ui/scripts/kept.mjs (by title),
# per verb, seat and layout of ui/scripts/verbs.mjs, and per prompt shape, seat and layout of
# ui/scripts/shapes.mjs. Each check's own inputs are the modules its script imports and the
# files they read, so a change to the verb cases reaches no kept check.
[family.ui-test]
kind = "regression"
adapter = "jsonl"
platforms = ["macos"]
needs = ["cli", "ui-deps"]
resources = ["browser-pages"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.browser list ui-test"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.browser run ui-test {checks}"
# `ui/verbs.json` and `ui/shapes.json` name the verb and shape checks that `list` prints.
inputs = [
  "ui/src/**",
  "ui/index.html",
  "ui/vite.config.ts",
  "ui/package.json",
  "ui/public/**",
  "ui/fixtures.json",
  "ui/verbs.json",
  "ui/shapes.json",
  "crate:beryl_cli_main",
  "tools/src/beryl_tools/ignite/browser.py",
  "tools/src/beryl_tools/suites.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/conventions.py",
  "tools/src/beryl_tools/motion_measure.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
  "tools/src/beryl_tools/video.py",
  "tools/src/beryl_tools/video_measure.py",
  "tools/src/beryl_tools/video_shape.py",
]

# The kept checks that show the browser UI starts and plays (`SMOKE_TITLES` in
# tools/src/beryl_tools/suites.py): the start screen starts a game, and on a recorded game the
# stage passes priority and plays a land. Each takes about a second and runs on the page's own
# clock, so it passes on a loaded machine. `app` is protected in ignite.toml for the same reason.
[family.ui-smoke]
kind = "regression"
adapter = "jsonl"
platforms = ["macos"]
needs = ["cli", "ui-deps"]
resources = ["browser-pages"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.browser list ui-smoke"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.browser run ui-smoke {checks}"
inputs = [
  "ui/src/**",
  "ui/index.html",
  "ui/vite.config.ts",
  "ui/package.json",
  "ui/public/**",
  "ui/fixtures.json",
  "ui/verbs.json",
  "ui/shapes.json",
  "crate:beryl_cli_main",
  "tools/src/beryl_tools/ignite/browser.py",
  "tools/src/beryl_tools/suites.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/conventions.py",
  "tools/src/beryl_tools/motion_measure.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
  "tools/src/beryl_tools/video.py",
  "tools/src/beryl_tools/video_measure.py",
  "tools/src/beryl_tools/video_shape.py",
]

