# the client, the native client in its own Cargo workspace, client: its formatting, clippy,
# source rules, tests, replays, interface tests and frame gates, with the build product they
# share. See docs/ignite.md, "Declaring a family" and "Builds".
#
# Commands run from the checkout's root. The `python-env` product is in python.toml.
# The adapter for every `jsonl` family here is
# tools/src/beryl_tools/ignite/client.py, which runs the programs the `client` product built
# rather than `just client`, whose commands build again. A `jsonl` family's `list` prints one JSON
# object per check, with the inputs of its own, and its `run` appends one JSON line per check to
# $IGNITE_RESULTS.
#
# The native build and replay checks run on macOS and Windows. The Windows
# replay workload took over an hour per tip candidate without finding a
# Windows-only defect, so those regression families defer Windows coverage
# until after master moves. Windows compile and validation checks still
# participate in tip verification.
# The pure source checks run on any platform.
#
# Programs that spread their work over threads (the recorder and replay checks) size them by the grant:
# `IGNITE_CORES` when they start, and the file `IGNITE_CORES_FILE` names while they run
# (`runner::threads` and `runner::granted` in client/crates/beryl_inspect/src/runner.rs).
# A grant fixed when such a program started made it run on one or two threads after the cores
# freed up: `client test` took 150 s instead of 11-13 s. So the `client` product, whose build ends with
# `record`, and the families that run `client test` say `grows = true`, and the scheduler gives
# them cores as they free up. Nextest also passes the growing grant to its replay tests.
#
# Inputs outside The client's own crates. The client's crates depend on main-workspace crates by
# path, which `crate:` does not follow out of its own workspace, so the families name those
# crates' directories. The recordings are played by `beryl_cli`, so the families that read the
# recordings pack name every crate `record`, `client` and `gate` are built from
# (tools/tests/test_ignite_client.py holds the list to the crates' manifests), the files
# those crates embed or read (the fixture definitions, the sample decks, UI conventions, the
# card store and set groups, the table commands, the save breaks) and The client's tuning,
# audio manifests and design tokens. The fixture definitions are part of the top-level the client
# JSON inputs. Each replay check lists the card files its recording plays.

# The build that the tests, `record` and `gate` share, then the recordings pack. Every
# `just client` command starts with one today. The shared build is every target that
# `cargo nextest run --workspace` builds, in cargo's `test` profile, with each program built as
# a program: building `record` or `client` alone resolved other features and compiled the engine
# and `beryl_scene` three times after an edit to `beryl_scene`. The pack goes to
# $BERYL_CACHE/b3d, named for a hash of what a recording reads, and is built only when missing.
[product.client]
compiles = true
# Nextest uses the same Cargo configuration as the shared build from this directory.
dir = "client"
build = "uv run --quiet --project ../tools python -m beryl_tools.ignite.client build"
grows = true
inputs = [
  ".cargo/config.toml",
  "client/**",
  "engine/crates/**",
  "engine/cards/**",
  "engine/Cargo.toml",
  "data/client/*.json",
  "data/client/conventions/**",
  "data/client/corpus.txt",
  "data/client/effects/**",
  "data/client/profiles/**",
  "data/design-tokens.json",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/set-groups.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "data/audio/manifest.json",
  "data/audio/loops.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/client.py",
  "tools/src/beryl_tools/ignite/client_validation.py",
  "tools/src/beryl_tools/system.py",
]
outputs = ["client/target"]

