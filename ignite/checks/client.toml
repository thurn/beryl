# Frame work trends across verified commits, using the same boards as the native frame gate.
[family.client-frame-trend]
# Idle work samples verified commits and reports increases without holding a landing.
kind = "exploration"
# The Python adapter emits one JSONL result for each sampled commit.
adapter = "jsonl"
# Sample each registered verifier's native build and, when free, its Callgrind guest.
platforms = ["macos", "windows"]
defer_platforms = ["windows"]
needs = ["python-env", "client"]
# Both list and next offer the checkout's commit when its calibration's history lacks it.
list = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-frame-trend list"
next = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-frame-trend next"
# Record native counters on every run. The adapter takes the benchmark VM's guest locks only
# for optional Callgrind sampling, so this family needs no scheduler reservation for bench-vm.
run = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-frame-trend run {checks}"
# The gate binaries and recordings share these inputs with the frame gates. The trend and
# counting modules also read the board budgets and produce the optional instruction counts.
inputs = [
  "crate:beryl_inspect",
  "crate:beryl_record",
  "engine/crates/beryl_card/**",
