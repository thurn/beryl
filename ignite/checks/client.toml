# Clippy over the workspace, one check per package. It builds in its own target directory,
# client/target/clippy: its check units are not the ones a build makes, so in the shared
# directory it would share no work with the `client` build, only Cargo's lock on it, and wait for
# it. Lints are capped at warnings so that cargo keeps every unit's result and a later run
# replays them (`CLIPPY` in tools/src/beryl_tools/ignite/client.py).
#
# It is in the always set only for a change to The client's own files, its toolchain or this
# family's commands. Its run checks the game's crates once more in its own target directory, so
# on every change to the game it cost about 1,900 billion instructions, four times the gate's
# whole budget: four minutes of a one-card change's landing. It never failed after a change
# that touched only the game's crates. Such a change can break it only through the API the client
# calls, which the `client` build of the scored the client families also compiles; otherwise it is
# scored, and tip verification runs it.
[family.client-clippy]
kind = "regression"
adapter = "jsonl"
platforms = ["macos", "windows"]
needs = ["python-env"]
always = true
# A build check: a failure means the code does not type-check, so `green` does not move.
builds = true
always_when = [
  "client/**",
  ".cargo/config.toml",
  "rust-toolchain.toml",
  "ignite/checks/client.toml",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/ignite/client.py",
]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-clippy list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-clippy run {checks}"
inputs = [
