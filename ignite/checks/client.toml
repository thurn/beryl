# Instructions per frame of every gated board, counted under Callgrind in `beryl3d-bench`.
# The gate holds `worst_frame_instructions` and `total_instructions` and checks scaling between
# `stress-255` and `stress-1024` (tools/src/beryl_tools/client/counts.py). Callgrind counts every
# board in one run. Each verifier uses its own Linux guest profile and takes the `bench-vm`
# resource. The run builds in the guest and reads the recordings pack from the `client` product.
[family.client-frame-counts]
kind = "regression"
adapter = "jsonl"
platforms = ["macos", "windows"]
defer_platforms = ["windows"]
machine_relative = true
needs = ["python-env", "client"]
resources = ["bench-vm"]
# Listing reads board metadata from the host and probes the guest's tool versions.
list_without_resources = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-frame-counts list"
# The listing comes from what a built program does, which comments cannot change, so a change
# that edits only comments keeps the listing and builds nothing to list.
listing_ignores_comments = true
run = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-frame-counts run {checks}"
inputs = [
  "crate:beryl_inspect",
  "crate:beryl_record",
