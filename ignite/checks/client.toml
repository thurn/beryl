# The landing gate checks the corpus and fixtures. The full sweep runs on idle cores.
kind = "exploration"
# The adapter reports one result per card crate as soon as its sweep finishes.
adapter = "jsonl"
# The sweep uses the native the client recorder and inspector.
platforms = ["macos", "windows"]
defer_platforms = ["windows"]
# The sweep needs both native binaries and starts from the corpus pack made by `client`.
needs = ["python-env", "client"]
# Listing needs the Python environment before either native binary is built.
list_needs = ["python-env"]
# List one check per card crate found in the checkout.
list = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-corpus list"
# Each crate's digest changes when its cards or shared recording and interface inputs change.
next = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-corpus next"
# Run the named crate sweeps, reusing results already saved for those digests.
run = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-corpus run {checks}"
# The sweep uses the same native code and data as the interface checks, plus its own adapter.
# The `client` product covers card definitions and `next` hashes them by crate.
inputs = [
  "crate:beryl_inspect",
  "crate:beryl_record",
  "engine/crates/beryl_card/**",
  "engine/crates/beryl_card_build/**",
