# The native frame gate (`just client gate`): one check per gated board, holding its work counters,
# draw load and allocations to the limits under `boards.<board>` in data/client/budgets.json,
# in Baseline and Enhanced, using the registered native verifier's calibration.
# Idle work samples the boards together. Intentional layout changes can move blended area.
[family.client-gate]
kind = "exploration"
adapter = "jsonl"
platforms = ["macos", "windows"]
defer_platforms = ["windows"]
needs = ["python-env", "client"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-gate list"
next = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-gate next"
# The listing comes from what a built program does, which comments cannot change, so a change
# that edits only comments keeps the listing and builds nothing to list.
listing_ignores_comments = true
run = "uv run --quiet --project tools python -m beryl_tools.ignite.client client-gate run {checks}"
inputs = [
  "crate:beryl_inspect",
  "crate:beryl_record",
  "engine/crates/beryl_card/**",
