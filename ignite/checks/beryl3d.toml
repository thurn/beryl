# Beryl 3D, the native client in its own Cargo workspace, rust/beryl3d: its formatting, clippy,
# source rules, tests, interface tests, frame gates and timeline parity, with the build product
# they share. See docs/ignite.md, "Declaring a family" and "Builds".
#
# Commands run from the checkout's root. The `python-env` product is in python.toml and
# `ui-deps` in ui.toml. The adapter for every `jsonl` family here is
# tools/src/beryl_tools/ignite/beryl3d.py, which runs the programs the `b3d` product built
# rather than `just b3d`, whose commands build again. A `jsonl` family's `list` prints one JSON
# object per check, with the inputs of its own, and its `run` appends one JSON line per check to
# $IGNITE_RESULTS.
#
# Beryl 3D is built and tested on macOS only, so every family that builds it needs a pass there.
# The pure source checks are `any`.
#
# Programs that spread their work over threads (`record`, `b3d test`) size them by the grant:
# `IGNITE_CORES` when they start, and the file `IGNITE_CORES_FILE` names while they run
# (`runner::threads` and `runner::granted` in rust/beryl3d/crates/beryl_inspect/src/runner.rs).
# A grant fixed when such a program started made it run on one or two threads after the cores
# freed up: `b3d test` took 150 s instead of 11-13 s. So the `b3d` product, whose build ends with
# `record`, and the families that run `b3d test` say `grows = true`, and the scheduler gives
# them cores as they free up.
#
# Inputs outside Beryl 3D's own crates. Beryl 3D's crates depend on main-workspace crates by
# path, which `crate:` does not follow out of its own workspace, so the families name those
# crates' directories. The recordings are played by `beryl_cli`, so the families that read the
# recordings pack name every crate `record`, `b3d` and `gate` are built from
# (tools/tests/test_ignite_beryl3d.py holds the list to the crates' manifests), the files
# those crates embed or read (the fixture definitions, the sample decks, UI conventions, the
# card store and set groups, the table commands, the save breaks) and Beryl 3D's data
# (data/beryl3d, and the design tokens `beryl_scene`'s build reads). The card crates' own
# files are named too, but no card file: each check lists the card files its recording plays.

# The build that the tests, `record` and `gate` share, then the recordings pack. Every
# `just b3d` command starts with one today. The shared build is every target that
# `cargo nextest run --workspace` builds, in cargo's `test` profile, with each program built as
# a program: building `record` or `b3d` alone resolved other features and compiled the engine
# and `beryl_scene` three times after an edit to `beryl_scene`. The pack goes to
# $BERYL_CACHE/b3d, named for a hash of what a recording reads, and is built only when missing.
[product.b3d]
build = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d build"
grows = true
inputs = [
  "rust/beryl3d/**",
  "rust/crates/**",
  "rust/cards/**",
  "rust/Cargo.toml",
  "data/beryl3d/**",
  "data/design-tokens.json",
  "data/card-store.tsv",
  "data/catalogs.json",
  "ui/src/generated/**",
  "data/set-groups.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/fixtures.json",
  "ui/src/audio/manifest.json",
  "ui/src/audio/loops.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/beryl3d.py",
]
outputs = ["rust/beryl3d/target"]

# rustfmt over each package of the workspace, one check per package, hashed over its directory.
[family.b3d-format]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
always = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d b3d-format list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d b3d-format run {checks}"
inputs = [
