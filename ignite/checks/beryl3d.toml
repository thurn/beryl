# Sweep all card recordings and report interface faults or signatures missing from the corpus.
[family.b3d-corpus]
# The landing gate checks the corpus and fixtures. The full sweep runs on idle cores.
kind = "exploration"
# The adapter reports one result per card crate as soon as its sweep finishes.
adapter = "jsonl"
# The sweep uses the native Beryl 3D recorder and inspector.
platforms = ["macos", "windows"]
# The sweep needs both native binaries and starts from the corpus pack made by `b3d`.
needs = ["python-env", "b3d"]
# Listing needs the Python environment before either native binary is built.
