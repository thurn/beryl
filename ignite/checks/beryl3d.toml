# Every test of the workspace that cargo-nextest runs, each hashed over the package that holds
# it and the Beryl 3D packages it depends on, and over the main workspace, which `crate-closure`
# does not follow into. The tests read the recordings, so they need the `b3d` product, whose
# shared build is the one nextest would make. As for the `rust` family (rust.toml), Ignite
# appends the filterset of the tests to run and reads their outcomes from the libtest JSON.
#
# Ignite hashes a `nextest` family's tests over what their builds were observed to read rather
# than over the path inputs of the products the family needs (docs/ignite.md, "Observed
# inputs"), so the script that builds the `b3d` product and the recordings is listed here too.
[family.b3d-test]
kind = "regression"
adapter = "nextest"
platforms = ["macos"]
needs = ["b3d"]
list = "cargo nextest list --manifest-path rust/beryl3d/Cargo.toml --locked --cargo-quiet --workspace --message-format json"
run = "cargo nextest run --manifest-path rust/beryl3d/Cargo.toml --locked --cargo-quiet --workspace --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = [
  "crate-closure",
  "rust/beryl3d/.config/nextest.toml",
  "rust/crates/**",
  "rust/cards/**",
  "rust/Cargo.toml",
  "data/beryl3d/**",
  "data/design-tokens.json",
  "data/card-store.tsv",
  "data/catalogs.json",
  "ui/src/generated/**",
  "data/set-groups.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/fixtures.json",
  "ui/src/audio/manifest.json",
  "ui/src/audio/loops.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/beryl3d.py",
]

# Every interface test (`just b3d test`): each recording from each seat in each desktop window,
# `b3d-interface:<recording>/<seat>/<window>`, with the checks applied at the check times
# (docs/beryl-3d.md, "Test speed"), held to data/beryl3d/test-faults.json. Each check reads the
# card files its recording plays. `b3d-interface:frame-limits` holds the frames drawn to the
# limits under `tests` in data/beryl3d/gates.json, whose median is over every test, so it runs
# them all.
#
# Tip verification runs `b3d-every-tick` in its place (`covered_by`): the every-tick run applies
# the checks on every tick, so it finds every fault the check times find, and both families list
# the same tests with the same inputs. Only `b3d-interface:frame-limits`, which `b3d-every-tick`
# does not list, still runs here at the tip. The landing gate may still choose this cheaper
# family.
[family.b3d-interface]
kind = "regression"
adapter = "jsonl"
platforms = ["macos"]
needs = ["python-env", "b3d"]
grows = true
covered_by = "b3d-every-tick"
list = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d b3d-interface list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d b3d-interface run {checks}"
