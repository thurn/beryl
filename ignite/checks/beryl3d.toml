# Every test of the workspace that cargo-nextest runs, each hashed over the package that holds
# it and the Beryl 3D packages it depends on, and over the main workspace, which `crate-closure`
# does not follow into. The tests read the recordings, so they need the `b3d` product, whose
# shared build is the one nextest would make. As for the `rust` family (rust.toml), Ignite
# appends the filterset of the tests to run and reads their outcomes from the libtest JSON.
#
# Ignite hashes a `nextest` family's tests over what their builds were observed to read rather
# than over the path inputs of the products the family needs (docs/ignite.md, "Observed
# inputs"), so the script that builds the `b3d` product and the recordings is listed here too.
[family.b3d-test]
kind = "regression"
adapter = "nextest"
platforms = ["macos", "windows"]
needs = ["b3d"]
# The differential replay and full-pack tests use the inspector runner's growing grant.
grows = true
list = "cargo nextest list --locked --cargo-quiet --workspace --message-format json"
# Test names do not depend on comments, so a change that edits only comments keeps the
# listing and builds nothing to list (docs/ignite.md, "Declaring a family").
listing_ignores_comments = true
run = "cargo nextest run --locked --cargo-quiet --workspace --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = [
  "rust/.cargo/config.toml",
  "crate-closure",
  "rust/beryl3d/.config/nextest.toml",
  "rust/crates/**",
  "rust/cards/**",
  "rust/Cargo.toml",
  "data/beryl3d/*.json",
  "data/beryl3d/conventions/**",
  "data/beryl3d/corpus.txt",
  "data/beryl3d/effects/**",
  "data/beryl3d/profiles/**",
  "data/design-tokens.json",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/set-groups.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "data/audio/manifest.json",
  "data/audio/loops.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/beryl3d.py",
  "tools/src/beryl_tools/ignite/beryl3d_validation.py",
]

# Every interface test (`just b3d test`): each recording from each seat in each desktop window,
# `b3d-interface:<recording>/<seat>/<window>`, with the checks applied at the check times
# (docs/beryl-3d.md, "Test speed"), held to data/beryl3d/test-faults.json. Each check reads the
# card files its recording plays.
#
# Tip verification scores the two families independently. Substituting `b3d-every-tick`
# discarded the failure history of `b3d-interface` before scoring, so the tip budget deferred
# the replacement checks for regressions the landing gate was already finding.
[family.b3d-interface]
kind = "regression"
adapter = "jsonl"
platforms = ["macos", "windows"]
needs = ["python-env", "b3d"]
grows = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.beryl3d b3d-interface list"
# The listing comes from what a built program does, which comments cannot change, so a change
# that edits only comments keeps the listing and builds nothing to list.
