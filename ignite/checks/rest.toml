# The remaining check families: the instruction-count gate, the two exploration searches that run
# on idle cores (`fuzz` and `exhaust`), the tests that read every card file (`scale`), the iroh
# transport and Ignite's own workspace. Their adapter is tools/src/beryl_tools/ignite/rest.py
# (the iroh tests and Ignite's tests use the `nextest` adapter instead), which lists each family's checks and
# reports results as JSON lines. See docs/ignite.md, "Declaring a family", "Reporting results"
# and "Exploration checks". The `python-env` product is in python.toml.

# Lessons from the checks Ignite replaces:
#
# - The count steps use Lima on macOS and WSL on Windows. Lima receives the sources when the
#   build tree is outside its mounts. WSL sees the Windows drives. The `bench-vm` resource
#   serializes counts that share the same VM lock and build directory.
# - A count says nothing about speed, so a loaded machine does not change it; the family may
#   run in any class. Only a run in the `tip` class stores its count, since only a tip is a
#   commit that was verified (`IGNITE_CLASS`, see rest.py).
# - Fuzzing and exhaustive search run optimized but with debug assertions and overflow checks on
#   (`CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS`, `CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS`): a debug
#   build plays too few games and a plain release build skips the invariants. Their results never
#   block anything; a failure is a bug found, not a commit to blame.
# - The package beryl_link_iroh is left out of every other family because the cold build of its
#   iroh dependency alone can outlast a fast check. Here it is one build (`iroh-tests`), cached
#   with the other test binaries, and the checks hold no cores while it builds.

# The rollout benchmark's instruction count against the bar in
# rust/crates/beryl_bench/count-gate.toml (that file's comments say when the bar may move), as
# `counts:rollouts`, and each family's present cost against its ratio there, as
# `counts:family/<name>` on both platforms. Each verifier uses its own calibrated limits
# and trend. Missing or incompatible calibration makes the check incomplete.
[family.counts]
kind = "regression"
adapter = "jsonl"
machine_relative = true
platforms = ["macos", "windows"]
needs = ["python-env"]
# The list reads the gate file and observes the local count guest without building a product.
list_needs = []
# Listing reads the gate file without starting the benchmark VM.
list_without_resources = true
resources = ["bench-vm"]
# The adapter waits while Callgrind runs in the Linux guest. The guest's CPU shows as load
# outside Ignite.
cores = 1
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rest list counts"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rest run counts {checks}"
inputs = [
  "crate:beryl_bench",
  "rust/crates/beryl_bench/count-gate.toml",
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust-toolchain.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "data/set-groups.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/bench.py",
  "tools/src/beryl_tools/calibration.py",
  "tools/src/beryl_tools/count_gate.py",
  "tools/src/beryl_tools/vm_host.py",
  "tools/src/beryl_tools/deps.py",
  "tools/src/beryl_tools/count_trend.py",
  "tools/src/beryl_tools/ignite/rest.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/names.py",
  "tools/src/beryl_tools/ignite/script.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
]

# Random-game fuzzing: `next` reserves a batch of seeds on this machine that no earlier batch
# used and yields one check per search, `fuzz:<target>/<first seed>+<games>`. The targets are the
# engine's games, the games that shrink to a few choices, the keystone families' games and the
# session's games with every script checked (the four searches of `just fuzz`).
[family.fuzz]
kind = "exploration"
adapter = "jsonl"
platforms = "any"
needs = ["fuzz-tests", "python-env"]
# The list prints nothing (the checks come from `next`), so it needs no test build.
list_needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rest list fuzz"
next = "uv run --quiet --project tools python -m beryl_tools.ignite.rest next fuzz"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rest run fuzz {checks}"
inputs = [
  "crate:beryl_search",
  "crate:beryl_session",
  "rust/Cargo.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "data/set-groups.json",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/rest.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/count_trend.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/names.py",
  "tools/src/beryl_tools/ignite/script.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
]

# Every sequence of decisions from the end positions of one card's scenarios
# (`just exhaust <card>`), deeper than the fast check's: one check per card,
# `exhaust:<card>/depth<d>-nodes<n>`. A card's own input is its file, so editing one card
# replays only that card; the family's inputs are the crates the search reads, without the card
# files (the list is the `script` family's, which reads the same crates).
[family.exhaust]
kind = "exploration"
adapter = "jsonl"
platforms = "any"
needs = ["exhaust-tests", "python-env"]
# The list prints nothing (the checks come from `next`), so it needs no test build.
list_needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rest list exhaust"
next = "uv run --quiet --project tools python -m beryl_tools.ignite.rest next exhaust"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rest run exhaust {checks}"
inputs = [
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/crates/beryl_card/**",
  "rust/crates/beryl_card_build/**",
  "rust/crates/beryl_card_names/**",
  "rust/crates/beryl_card_records/**",
  "rust/crates/beryl_card_shared/**",
  "rust/crates/beryl_card_store/**",
  "rust/crates/beryl_cards/**",
  "rust/crates/beryl_engine/**",
  "rust/crates/beryl_kernel/**",
  "rust/crates/beryl_rules/**",
  "rust/crates/beryl_scenario/**",
  "rust/crates/beryl_scenario_types/**",
  "rust/cards/*/Cargo.toml",
  "rust/cards/*/build.rs",
  "rust/cards/*/lib.rs",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "tools/src/beryl_tools/ignite/rest.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/count_trend.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/names.py",
  "tools/src/beryl_tools/ignite/script.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
]

# The Python tests that read every card file or the vocabulary (the scale harness's, the card
# name check's, `card brief`'s and the spec names'). The `pytest` family hashes a test over the
# Python modules it imports, which cannot see a card file, so a change to a card would not
# rerun them there. Each check's inputs are what `pytest` would give it plus the card crates
# and files, and they run here in the same way, with the plugin of python.py.
[family.scale]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rest list scale"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rest run scale {checks}"
inputs = [
  "tools/pyproject.toml",
  "tools/uv.lock",
  "rust/cards/**",
  "rust/crates/beryl_card/**",
  "rust/crates/beryl_card_build/**",
  "rust/crates/beryl_card_names/**",
  "rust/crates/beryl_card_store/**",
  "rust/crates/beryl_cards/**",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "tools/src/beryl_tools/ignite/rest.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/count_trend.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/names.py",
  "tools/src/beryl_tools/ignite/script.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
]

# The iroh transport: building `beryl_link_iroh` and playing its tests over loopback with the
# relay off, as the nightly did. Only the Mac ran it. It is a family of its own, and every other
# Rust build product excludes the package, because a cold build of the iroh dependency alone
# outlasted the old fast check's whole budget.
[family.iroh]
kind = "regression"
adapter = "nextest"
platforms = ["macos"]
needs = ["iroh-tests"]
list = "cargo nextest list --locked -p beryl_link_iroh --message-format json"
# Test names do not depend on comments, so a change that edits only comments keeps the
# listing and builds nothing to list (docs/ignite.md, "Declaring a family").
listing_ignores_comments = true
run = "cargo nextest run --locked --cargo-quiet -p beryl_link_iroh --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = ["crate-closure", "rust/Cargo.toml", "rust/.config/nextest.toml"]

# Every test of Ignite's own workspace, as `ignite:<binary id>::<test>`. The workspace shares
# nothing with the game's, so only a change under `ignite/` (or to `ignite.toml`) selects these
# checks, and no other family reads those paths. This is the family `release_family` names in
# ignite.toml: a commit that changed Ignite moves the release branch only once every test here
# passed on it.
#
# Each test hashes its own package and the packages that package depends on (`crate-closure`),
# not all of `ignite/`. With `ignite/**` as the input, every edit to a check manifest in this
# directory, and every Ignite change that landed before a landing, changed the hash of all 1562
# tests: on 2026-11-19 a Beryl 3D change that edited beryl3d.toml ran the whole workspace's tests
# on each of its four landing passes, 40 to 200 s each.
#
# The tests run under cargo-nextest, which runs every test binary at once, from the build of
# `ignite-tests`. Through `cargo test`, which runs the binaries one after another, the same 1325
# tests took 38 to 57 s on a warm tree on 2026-11-18, against 13 s here. The command runs in
# ignite/, the directory of the first product the family needs. The workspace's nextest profile
# `ignite` (ignite/.config/nextest.toml) ends a test that runs past 120 s, so a hung test
# fails by name. It runs every test, including the slow ones the express lane's `express`
# profile leaves out. All crates stay in the run: testing
# `ignite_daemon` alone once missed a failing test in `ignite_core`.
[family.ignite]
kind = "regression"
adapter = "nextest"
platforms = "any"
needs = ["ignite-tests"]
list = "cargo nextest list --locked --workspace --message-format json"
# Test names do not depend on comments, so a change that edits only comments keeps the
# listing and builds nothing to list (docs/ignite.md, "Declaring a family").
listing_ignores_comments = true
run = "cargo nextest run --locked --cargo-quiet --workspace --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = ["crate-closure", "ignite/.config/nextest.toml"]

# What one package's tests read beyond their own crates and do not open through
# `ignite_core::test_files`, which records each read. ignite_cli's tests read ignite.toml and
# ignite/AGENTS.md and CLAUDE.md. They do not read the repository's `.agents/` or `.claude/`:
# `pool init` writes its own skill into a scratch folder and takes its instructions through
# `include_str!`, which Cargo's dep-info records. Listing those directories made every skill
# edit an input of all of ignite_cli's tests. ignite_daemon's tests read ignite.toml and the nextest config, ignite_hub's preview
# reads both, and the daemon's and ignite_git's tests write a .gitignore into the repositories
# they make, which the check that holds reads to inputs counts. That is library code or a
# program, which cannot take the helper of a test-only dependency. ignite_core's and
# ignite_store's tests use the helper.
[family.ignite.package_inputs]
ignite_cli = [
  "ignite.toml",
  "ignite/AGENTS.md",
  "ignite/CLAUDE.md",
]
ignite_daemon = ["ignite.toml", "ignite/.config/**", ".gitignore"]
ignite_git = [".gitignore"]
ignite_hub = ["ignite.toml", "ignite/.config/**"]

# Ignite's tests of the code that behaves differently on Windows and macOS, which must pass on
# both. The `ignite` family above needs one pass on any machine, so on 2026-11-19 a change that
# passed on a Mac broke every Rust build on Windows (the build shims), and a change that passed
# on Windows failed its own test on macOS (a Windows path read with the host's separator). These
# checks hold `master` until both kinds of machine pass them. They are the whole of `ignite_os`,
# the daemon's modules that start processes, install releases, measure disks and write the
# build shims, and the shim test of the `ignite` executable: 162 tests that ran in 1.9 s on
# jarvis on 2026-11-19. They also run in the `ignite` family; that costs two seconds, and keeps
# the `ignite` family whole. The listing's filterset is written without spaces, since Ignite
# splits the command on whitespace; the run command names no tests (see the `rust` family).
[family.ignite-platform]
kind = "regression"
adapter = "nextest"
platforms = ["macos", "windows"]
needs = ["ignite-tests"]
list = "cargo nextest list --locked --workspace --message-format json -E package(ignite_os)|(package(ignite_daemon)&test(/^(wrap|supervise|update|trees::disk|machine_lock|doctor)(::|_tests::)/))|(binary_id(ignite_cli::bin/ignite)&test(/^shim_tests::/))"
# Test names do not depend on comments, so a change that edits only comments keeps the
# listing and builds nothing to list (docs/ignite.md, "Declaring a family").
listing_ignores_comments = true
run = "cargo nextest run --locked --cargo-quiet --workspace --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = ["crate-closure", "ignite/.config/nextest.toml"]

[family.ignite-platform.package_inputs]
ignite_cli = [
  "ignite.toml",
  "ignite/AGENTS.md",
  "ignite/CLAUDE.md",
]
ignite_daemon = ["ignite.toml", "ignite/.config/**", ".gitignore"]

# Formatting and clippy over Ignite's workspace, as `ignite-lint:fmt` and `ignite-lint:clippy`.
# Neither reads the test build, so they need only the Python environment and run while
# `ignite-tests` builds. Clippy compiles the workspace's crates once more in its own check
# mode, which cargo cannot share with the test build; on a warm tree after an edit that took
# about 4 s.
#
# In the always set, like every other format and lint family: a change that touches Ignite and
# also Beryl files takes the Beryl gate, whose instruction budget would otherwise leave clippy
# to tip verification, and a lint failure then landed on `staging` that an Ignite-only change
# would have caught. It still runs only when its inputs change.
[family.ignite-lint]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
always = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rest list ignite-lint"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rest run ignite-lint {checks}"
inputs = [
  "ignite/**",
  "tools/src/beryl_tools/ignite/rest.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/count_trend.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/names.py",
  "tools/src/beryl_tools/ignite/script.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/system.py",
]

# The iroh transport's test binaries. The package's dev-dependency on
# beryl_workspace_hack gives shared dependencies the same features as the Rust tests.
# The rest of the workspace can still build without compiling the iroh transport.
[product.iroh-tests]
build = "cargo nextest run --no-run --locked --cargo-quiet -p beryl_link_iroh"
dir = "rust"
inputs = ["crate:beryl_link_iroh", "rust/Cargo.toml"]
outputs = ["rust/target"]

# The test binaries of the fuzzers, optimized with debug assertions and overflow checks on (the
# build `just fuzz` makes). They land in rust/target/release.
[product.fuzz-tests]
build = "env CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true cargo test --release --locked --no-run -p beryl_search -p beryl_session"
dir = "rust"
inputs = ["crate:beryl_search", "crate:beryl_session", "rust/Cargo.toml", "data/card-store.tsv", "data/catalogs.json", "data/table-commands.json", "data/save-breaks.json", "data/ui-conventions.json", "ui/src/generated/**", "docs/sample-decks/**", "data/set-groups.json"]
outputs = ["rust/target"]

# The exhaustive search's test binary, built the same way.
[product.exhaust-tests]
build = "env CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true cargo test --release --locked --no-run -p beryl_cards --test exhaust"
dir = "rust"
inputs = ["crate:beryl_cards", "rust/Cargo.toml", "data/card-store.tsv", "data/catalogs.json", "data/table-commands.json", "data/save-breaks.json", "data/ui-conventions.json", "ui/src/generated/**", "docs/sample-decks/**", "data/set-groups.json"]
outputs = ["rust/target"]

# The test binaries of Ignite's workspace, which has its own lock file and target directory. The
# `ignite` family's nextest run reuses this build. Its inputs are the workspace's crates, which
# `crate-closure` names one by one, so that a test's hash covers only its own crate's closure
# (see the `ignite` family).
[product.ignite-tests]
build = "cargo test --locked --no-run"
dir = "ignite"
inputs = ["crate-closure"]
outputs = ["ignite/target"]
