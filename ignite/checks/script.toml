# Shared script checks validate game recordings and card scenarios.
# tools/src/beryl_tools/ignite/script.py lists checks with their own inputs and reports JSON
# lines. See docs/ignite.md, "Declaring a family".

# One check per card, moment and seat (`script:<card>/<moment>/<seat>`), and one per UI fixture
# recording (`script:fixtures/<fixture>/<seat>`). A card's check reads the card's own file,
# which the adapter lists; the card files are therefore left out of the family's inputs below.
# `crate:beryl_cli_main` would pull in every card, so the crates `beryl_cli` builds on are named
# instead, with the card crates' manifests and build scripts but none of their cards. Regenerate
# the list with `cargo metadata` when `beryl_cli` gains a dependency.
[family.script]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["cli", "python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.script list script"
# The listing comes from `specs-check` and from the card names each card file's code holds;
# script.py's `code_only` leaves comments out of the second, so a change that edits only
# comments keeps the listing and builds nothing to list.
listing_ignores_comments = true
run = "uv run --quiet --project tools python -m beryl_tools.ignite.script run script {checks}"
inputs = [
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/crates/beryl_card/**",
  "rust/crates/beryl_card_build/**",
  "rust/crates/beryl_card_names/**",
  "rust/crates/beryl_card_records/**",
  "rust/crates/beryl_card_shared/**",
  "rust/crates/beryl_card_store/**",
  "rust/crates/beryl_cards/**",
  "rust/crates/beryl_cli/**",
  "rust/crates/beryl_cli_main/**",
  "rust/crates/beryl_engine/**",
  "rust/crates/beryl_kernel/**",
  "rust/crates/beryl_link/**",
  "rust/crates/beryl_link_iroh/**",
  "rust/crates/beryl_protocol/**",
  "rust/crates/beryl_rules/**",
  "rust/crates/beryl_scenario/**",
  "rust/crates/beryl_scenario_types/**",
  "rust/crates/beryl_search/**",
  "rust/crates/beryl_session/**",
  "rust/crates/beryl_table/**",
  "rust/crates/beryl_table_session/**",
  "rust/cards/*/Cargo.toml",
  "rust/cards/*/build.rs",
  "rust/cards/*/lib.rs",
  "data/card-store.tsv",
  "data/set-groups.json",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "docs/sample-decks/**",
  "data/beryl3d/fixtures.json",
  "tools/src/beryl_tools/ignite/script.py",
]

# Launch the native desktop executable headlessly and wait for its start screen.
