# The Rust workspace in rust/: its tests, clippy, formatting, doctests, the `allocations`
# binaries and the card-text check, with the build products they need. See docs/ignite.md,
# "Declaring a family" and "Builds".
#
# Commands run from the checkout's root. The `python-env` product is in python.toml. A `jsonl` family's `list` prints one JSON object per
# check, {"check": "<family>:<name>", "inputs": [...]}, where `inputs` holds the check's own
# entries in the syntax of a family's `inputs`. Its `run` gets the checks' names as separate
# arguments in place of `{checks}` and appends one JSON line per check to $IGNITE_RESULTS. The
# adapter for every `jsonl` family here is tools/src/beryl_tools/ignite/rust.py.
#
# `{packages}` in a product's build stands for `-p <package>` for each package whose checks
# will run. The package beryl_link_iroh is left to another family: the cold build of its iroh
# dependency alone outlasts a check.
#
# Inputs outside the crates' own directories: the workspace's manifest (lints, profiles,
# dependency versions), and the files crates embed or their tests read at run time, which
# `crate-closure` cannot see: the card store and set groups (beryl_card_store, beryl_card_build),
# the table commands (beryl_table), the save breaks, UI conventions and generated TypeScript
# (beryl_session, beryl_protocol) and the sample decks (beryl_app, beryl_cli). The `jsonl`
# families and the products list them. The `rust` family lists none of them: Ignite observes
# what each package's build reads (`include_str!`, `include_bytes!` and build scripts'
# `rerun-if-changed`) from Cargo's dep-info files, and what its tests open through
# `beryl_test_files`, and hashes both into the tests of every package that depends on them
# (docs/ignite.md, "Observed inputs").

# Every test of the workspace that cargo-nextest runs, each hashed over the package that holds
# it and the workspace packages it depends on. Tests marked #[ignore] are the fuzzer's and
# belong to an exploration family; nextest runs none of them by default. The harness-less
# `allocations` targets, which nextest cannot run, are the `allocations` family.
#
# Ignite splits these commands on whitespace and runs them without a shell, so a filterset is
# written without spaces or quotes (`!binary(allocations)`). The run command names no tests:
# Ignite appends `-E <filterset>` for the tests it chose, and reads each test's outcome from the
# libtest JSON that `--message-format libtest-json-plus` prints (see "Reporting results" in
# docs/ignite.md). A `nextest` family's commands run in the directory of the first product it
# needs, here rust/ (`rust-tests`), not the checkout's root. tools/tests/test_ignite_commands.py
# checks these rules.
#
# A `list` command leaves out `--cargo-quiet`, so Cargo's "Blocking waiting for file lock" and
# "Compiling" lines reach the output, where Ignite tells a listing that waited for another Cargo
# command in the tree from one that compiled (the `listed` line, docs/ignite.md). The listing
# itself is the one JSON line cargo-nextest prints, which the other lines do not disturb.
#
# `{packages}` selects packages as in the `rust-tests` build: the packages of the tests a run
# runs, or the whole workspace less that product's `exclude`. cargo-nextest compiles every test
# binary of the packages it selects before it lists or runs, so on 2026-11-19 `ignite test fork`
# after a one-line change to a card file recompiled 35 crates (33 s alone, 77 s beside the other
# builds) to run one test in beryl_cards. `ignite test` now lists this family for the packages
# of the tests it names, and every run selects only its tests' packages (docs/ignite.md,
# "Declaring a family").
[family.rust]
kind = "regression"
adapter = "nextest"
platforms = "any"
needs = ["rust-tests"]
list = "cargo nextest list --locked {packages} --message-format json -E !binary(allocations)"
# Test names do not depend on comments, so a change that edits only comments keeps the
# listing and builds nothing to list (docs/ignite.md, "Declaring a family").
listing_ignores_comments = true
run = "cargo nextest run --locked --cargo-quiet {packages} --profile ignite --no-fail-fast --status-level=fail --final-status-level=fail --message-format libtest-json-plus"
inputs = ["crate-closure", "rust/Cargo.toml", "rust/.config/nextest.toml"]

# What `beryl_cli`'s tests read at run time beyond the inputs above, hashed into that package's
# tests alone. Its blunder code, which tests and the `blunders` command share, opens the blunder
# list and positions and the replays and incident reports they name, and its fixtures read the
# sample decks. That is library code, which cannot depend on `beryl_test_files` (a dev-dependency
# of test code only), so these reads are listed here. Every other package's tests open
# repository files through `beryl_test_files`, which records each read, and the `check-inputs`
# source rule requires it.
[family.rust.package_inputs]
beryl_cli = ["docs/incidents/**", "data/blunders.json", "data/blunders/**", "docs/sample-decks/**"]

# The doctests of each package whose library has any, which cargo-nextest does not run. They
# are where a `compile_fail` block holds that one index type cannot pass for another.
[family.doctests]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rust doctests list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rust doctests run {checks}"
# The package manifests decide which packages `list` looks at.
inputs = [
  "rust/Cargo.toml",
  "rust/crates/*/Cargo.toml",
  "rust/cards/*/Cargo.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/paths.py",
]

# The harness-less `allocations` binaries, which count the allocations of hot paths. They are
# built with the test binaries.
#
# `list` reads only `cargo metadata`, so listing waits for no build. Waiting for `rust-tests`
# made a landing that changed one Python module these checks hash wait 40 minutes for a cold
# build of the workspace's tests in its tree, only to list two checks.
[family.allocations]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env", "rust-tests"]
list_needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rust allocations list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rust allocations run {checks}"
inputs = [
  "rust/Cargo.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/paths.py",
]

# Clippy over the whole workspace, one check per package, hashed over the package and every
# workspace package it depends on. It is also the type check, so it blocks every landing that
# touches its inputs.
[family.clippy]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env", "clippy"]
# `list` reads `cargo metadata` alone, not clippy's output. Waiting for the `clippy` product
# made a one-line card change build clippy (333 s) only to list one check per package.
list_needs = ["python-env"]
always = true
# A build check: a failure means the code does not type-check, so `green` does not move.
builds = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rust clippy list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rust clippy run {checks}"
inputs = [
  "rust/Cargo.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/set-groups.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/paths.py",
]

# rustfmt over each package's Rust files, the card files included, which no crate root reaches.
# One check per package, hashed over the package's directory alone.
[family.rust-format]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
always = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rust rust-format list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rust rust-format run {checks}"
# The workspace manifest and each package's manifest decide which packages are listed.
inputs = [
  "rust/rustfmt.toml",
  "rust/Cargo.toml",
  "rust/crates/*/Cargo.toml",
  "rust/cards/*/Cargo.toml",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/paths.py",
]

# Each card file's rendered rules text against its Oracle text (tools/src/beryl_tools/card_text.py
# says why), one check per card file and `card-text:allowlist` for allowlist entries that name
# no card file. One render covers every card, so every check reads the whole renderer.
[family.card-text]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env", "scenario-dump"]
# `list` names one check per card file from the file names alone; `run` renders the cards.
list_needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.rust card-text list"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.rust card-text run {checks}"
inputs = [
  "crate:beryl_scenario",
  "rust/Cargo.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "data/card-text-allowlist.json",
  "data/card-escalations.json",
  "tools/src/beryl_tools/card_text.py",
  "tools/src/beryl_tools/render_diff.py",
  "tools/src/beryl_tools/card_store.py",
  "tools/src/beryl_tools/card_files.py",
  "tools/src/beryl_tools/set_groups.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/rust.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/card.py",
  "tools/src/beryl_tools/card_crates.py",
  "tools/src/beryl_tools/card_header.py",
  "tools/src/beryl_tools/card_names.py",
  "tools/src/beryl_tools/cards.py",
  "tools/src/beryl_tools/catalogs.py",
  "tools/src/beryl_tools/nearest.py",
  "tools/src/beryl_tools/paths.py",
  "tools/src/beryl_tools/rulings.py",
  "tools/src/beryl_tools/scryfall.py",
  "tools/src/beryl_tools/store_cards.py",
  "tools/src/beryl_tools/system.py",
  "tools/src/beryl_tools/vocabulary.py",
  "tools/src/beryl_tools/xmage_classes.py",
]

# The test binaries of the packages named, in the `test` profile. With no packages named, as
# when a family is listed or a subset would change shared features, it builds the whole
# workspace less beryl_link_iroh (`exclude`), matching the CLI and scenario products.
# Building the transport is slow on a cold tree, so it has a separate test product.
# Its shared dependencies resolve with the same features through beryl_workspace_hack.
[product.rust-tests]
build = "cargo nextest run --no-run --locked --cargo-quiet {packages}"
exclude = ["beryl_link_iroh"]
dir = "rust"
inputs = ["crate-closure", "rust/Cargo.toml", "data/card-store.tsv", "data/catalogs.json", "data/table-commands.json", "data/save-breaks.json", "data/ui-conventions.json", "ui/src/generated/**", "docs/sample-decks/**", "data/set-groups.json"]
outputs = ["rust/target"]

# Clippy's pass over the workspace in its own target directory, rust/target/clippy. Cargo holds
# one lock on a target directory for the whole of a command, and clippy's check units are not the
# ones a build or test makes, so in rust/target the two shared no work and only waited on each
# other: from 2026-11-14 to 16 the old fast check killed clippy at its 180 s limit in 102 of 160
# runs while it printed "Blocking waiting for file lock on build directory". Lints are capped at warnings so that
# every unit's result is kept and the `clippy` family's run replays them (rust.py, `CLIPPY`).
[product.clippy]
compiles = true
build = "uv run --quiet --project tools python -m beryl_tools.ignite.rust clippy build"
inputs = [
  "rust/crates/**",
  "rust/cards/**",
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/table-commands.json",
  "data/save-breaks.json",
  "data/ui-conventions.json",
  "ui/src/generated/**",
  "docs/sample-decks/**",
  "data/set-groups.json",
  "tools/src/beryl_tools/ignite/rust.py",
]
outputs = ["rust/target/clippy"]

# The command-line tool, which the script, browser and oracle checks run. Built over the whole
# workspace's libraries in the `test` profile, as the test binaries are, so that neither build
# compiles a library the other did (tools/src/beryl_tools/paths.py, `CLI_BUILD`, says why): with
# `--bin` alone, beryl_kernel, beryl_table, beryl_rules and beryl_engine compiled a second time.
# tools/tests/test_cli_build.py fails if a dev-dependency turns on a feature that no normal
# dependency does, which would split the two builds again. The binary lands in rust/target/debug.
[product.cli]
build = "cargo build --locked --quiet --profile test --workspace --exclude beryl_link_iroh --lib --bin beryl_cli"
dir = "rust"
inputs = ["crate:beryl_cli_main", "crate:beryl_workspace_hack", "rust/Cargo.toml", "data/card-store.tsv", "data/catalogs.json", "data/table-commands.json", "data/save-breaks.json", "data/ui-conventions.json", "ui/src/generated/**", "docs/sample-decks/**", "data/set-groups.json"]
outputs = ["rust/target"]

# `beryl_scenario`, which dumps the oracle scenarios and renders the cards' rules text, built
# the same way as `cli`. The `test` profile builds at opt-level 1 (rust/Cargo.toml): an
# unoptimized `beryl_scenario` took 48 s to dump the scenarios, against 4.5 s.
[product.scenario-dump]
build = "cargo build --locked --quiet --profile test --workspace --exclude beryl_link_iroh --lib --bin beryl_scenario"
dir = "rust"
inputs = ["crate:beryl_scenario", "crate:beryl_workspace_hack", "rust/Cargo.toml", "data/card-store.tsv", "data/catalogs.json", "data/table-commands.json", "data/save-breaks.json", "data/ui-conventions.json", "ui/src/generated/**", "docs/sample-decks/**", "data/set-groups.json"]
outputs = ["rust/target"]
