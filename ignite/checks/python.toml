# The Python check families, over `tools/` and `efficiency/`. Their adapter is
# tools/src/beryl_tools/ignite/python.py, which lists each family's checks (with the inputs of
# their own) and reports results as JSON lines. See docs/ignite.md, "Declaring a family".

[product.python-env]
build = "uv sync --quiet --project tools"
inputs = ["tools/pyproject.toml", "tools/uv.lock"]
outputs = ["tools/.venv"]

# Formatting: one check per project, since black cannot check a part of one.
[family.black]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
always = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.python list black"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.python run black {checks}"
inputs = [
  "tools/pyproject.toml",
  "tools/uv.lock",
  "efficiency/pyproject.toml",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/names.py",
]

# Types: one check per project. Windows runs the locked Linux tool through WSL.
[family.pyre]
kind = "regression"
adapter = "jsonl"
platforms = ["macos", "windows"]
defer_platforms = ["windows"]
needs = ["python-env"]
always = true
# A build check: a failure means the code does not type-check, so `green` does not move.
builds = true
list = "uv run --quiet --project tools python -m beryl_tools.ignite.python list pyre"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.python run pyre {checks}"
inputs = [
  "tools/pyproject.toml",
  "tools/uv.lock",
  "efficiency/pyproject.toml",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/names.py",
]

# Tests: one check per test. A test's own inputs are its file, the modules it imports
# (directly or not), its conftest files and the files data/pytest-reads.json says those
# modules read at run time; these are what every test reads. The adapter's reads plugin
# fails a test that reads a tracked file the record does not list.
[family.pytest]
kind = "regression"
adapter = "jsonl"
platforms = "any"
needs = ["python-env"]
list = "uv run --quiet --project tools python -m beryl_tools.ignite.python list pytest"
run = "uv run --quiet --project tools python -m beryl_tools.ignite.python run pytest {checks}"
inputs = [
  "tools/pyproject.toml",
  "tools/uv.lock",
  "tools/tests/fixtures",
  "efficiency/pyproject.toml",
  "data/card-store.tsv",
  "data/catalogs.json",
  "data/pytest-reads.json",
  "tools/src/beryl_tools/ignite/python.py",
  "tools/src/beryl_tools/ignite/pytest_reads.py",
  "tools/src/beryl_tools/__init__.py",
  "tools/src/beryl_tools/ignite/__init__.py",
  "tools/src/beryl_tools/ignite/names.py",
]
