[project]
name = "beryl-tools"
version = "0.1.0"
description = "Beryl's command line: the app, checks, slow CI and warm worktree caches"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
by = "beryl_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black",
    # No Windows build: the python lane skips pyre there.
    "pyre-check; sys_platform != 'win32'",
    "pytest",
    "mdformat",
    "mdformat-gfm",
]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
