<!doctype html>
<meta charset="utf-8">
<title>Beryl tickets</title>
<script>
const ticket = location.pathname.match(/\/beads\/([^/]+?)(?:\.html)?$/)?.[1];
const target = ticket
    ? "https://tickets.thurn.workers.dev/by/beads/" + encodeURIComponent(ticket)
    : "https://tickets.thurn.workers.dev/by/";
location.replace(target + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0;url=https://tickets.thurn.workers.dev/by/">
<a href="https://tickets.thurn.workers.dev/by/">Open Beryl tickets</a>
