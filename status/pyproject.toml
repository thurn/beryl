[project]
name = "beryl-status"
version = "0.1.0"
description = "The beads as a static site, built on the cirrus design system"
requires-python = ">=3.12"
# Standard library only.
dependencies = []

[project.scripts]
beryl-status = "beryl_status.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cirrus = ["static/*.js", "static/css/*.css"]

# The same dev tools tools/pyproject.toml pins. The `status` check lane runs them from the
# tools' environment, so a worktree needs no second one.
[dependency-groups]
dev = [
    "black",
    # No Windows build: the lane skips pyre there.
    "pyre-check; sys_platform != 'win32'",
    "pytest",
]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:cacheprovider"
