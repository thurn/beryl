# Enact configuration. See ~/enact/README.md.
remote = "origin"
staging_branch = "staging"
master_branch = "master"

[checks]
fast = "uv run --quiet --project tools by check"
slow = "uv run --quiet --project tools by ci"
# A backstop that never fires first: it sits above the largest hang limit of any step of
# `by ci` (`hang.CAP`, 2400 s; tools/src/beryl_tools/hang.py), and `by ci` cuts off a step still
# running 60 s before it, naming the step (bisect.time_left).
slow_timeout = 3600
# Least seconds between one slow-CI run ending and the next starting, so a higher commit rate
# makes larger batches, not more runs. `by ci` already draws its CPU from the `ci` token class
# (tools/src/beryl_tools/tokens.py), capped at half the cores. Runs take about 330 s, so this
# keeps the runner idle for about half of the time and `master` still advances within minutes.
slow_min_gap = 300

[worktree]
root = ".worktrees"   # inside the checkout; gitignored
# Before Enact deletes a worktree, move its rust/target and ui/node_modules into the cache,
# where the next worktree's first command clones them from (tools/src/beryl_tools/warm.py).
remove = 'f="$ENACT_WORKTREE_PATH/tools/src/beryl_tools/warm.py"; [ -f "$f" ] || f="$ENACT_REPO/tools/src/beryl_tools/warm.py"; python3 "$f" remove'

[push]
# Land this host's pushes through Enact's merge queue: one fast check for a batch of up to 8
# branches, instead of one per push plus a re-check whenever another push lands first.
queue = true

# Beads labeled tier:light (mechanical work) run on a cheaper model.
[tiers.light.claude]
model = "sonnet"
# tier:opus and tier:sonnet are built into Enact and need no entry here.

# Codex Enact sessions default to Sol High for every spawned role.
[roles.executor.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.warden.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.steward.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.mason.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.sage.codex]
