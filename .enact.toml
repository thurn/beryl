# Enact configuration. See ~/enact/README.md.
remote = "origin"
staging_branch = "staging"
master_branch = "master"

[tickets]
project = "by"
url = "https://tickets.thurn.workers.dev"

[checks]
fast = "uv run --quiet --project tools by check"
slow = "uv run --quiet --project tools by ci"
# A backstop that never fires first: it sits above the largest hang limit of any step of
# `by ci` (`hang.CAP`, 2400 s; tools/src/beryl_tools/hang.py), and `by ci` cuts off a step still
# running 60 s before it, naming the step (bisect.time_left).
slow_timeout = 3600
# Least seconds between one slow-CI run ending and the next starting, so a higher commit rate
# makes larger batches, not more runs. `by ci` already draws its CPU from the `ci` token class
# (tools/src/beryl_tools/tokens.py), capped at half the cores. Runs take about 330 s, so this
# keeps the runner idle for about half of the time and `master` still advances within minutes.
slow_min_gap = 300
# Every slow-CI run reuses one worktree, `.worktrees/ci-runner`, keeping its rust/target: rustc
# discards incremental caches built at any other path, and a new tree per run rebuilt every
# changed crate from scratch (a one-function beryl_kernel change: 544 CPU-seconds of test build
# against 18). `by ci` copies its target into the cache for new worktrees (`caches.save_kept`).
slow_tree = "ci-runner"

[worktree]
root = ".worktrees"   # inside the checkout; gitignored
# Every worktree, ad hoc or for a bead, reuses one of ten fixed directories, slot-01 to slot-10,
# keeping its rust/target. rustc ignores incremental caches built at another path, so a new
# directory per change rebuilt every crate on the changed chain from scratch: after a one-function
# beryl_kernel change, 421-544 CPU-seconds of test build against 18 in a tree that built the
# previous state. In the fast check that cost was the Rust lane: on 2026-11-15, rust:tests was
# killed at the 180 s limit in 48 of 52 runs and rust:clippy in 87 of 157. Ten covers the usual
# number of live worktrees; when all are busy a tree gets a directory of its own name.
# `caches.tidy_target` keeps each slot's target within its budget.
slots = 10
# Before Enact deletes a worktree, move its ui/node_modules into the cache, and its rust/target
# too if it is one of slow CI's worktrees, the only ones that save it. The next worktree's
# first command clones them from there (tools/src/beryl_tools/warm.py).
remove = 'f="$ENACT_WORKTREE_PATH/tools/src/beryl_tools/warm.py"; [ -f "$f" ] || f="$ENACT_REPO/tools/src/beryl_tools/warm.py"; python3 "$f" remove'

[push]
# Each push checks itself and pushes, and a push that loses the race to staging rebases and checks
# again, rerunning only the lanes the commits that landed meanwhile can affect (`narrow` in
# tools/src/beryl_tools/changes.py). The merge queue (`queue = true`) ran a second check of each
# batch behind a lock shared with Cygnus; a lost lock threw a passing check away, and on
# 2026-11-14 a push waited 20 minutes in it. The fast check now fits 60 s and stops at 180 s
# (tools/src/beryl_tools/deadline.py), so a lost race costs little, and slow CI is the gate.
queue = false
# Each push's fast check runs in one of three reused worktrees, .worktrees/check-1 to check-3,
# with the pushed commit detached, instead of in the pushing tree (docs/checks.md). The pushing
# tree last built whatever staging was when its agent started, and rustc ignores incremental
# caches built at another path, so the check rebuilt every crate staging changed since: on
# 2026-11-16 a Beryl 3D push's shared test build had a median of 134 CPU-seconds (p90 303),
# against about 20 in a tree that built the commit before. Every push is staging's tip plus one
# change, so check trees stay close behind staging. With all three busy, the pushing tree checks.
check_trees = 3

# Beads labeled tier:light (mechanical work) run on a cheaper model.
[tiers.light.claude]
model = "sonnet"
# tier:opus and tier:sonnet are built into Enact and need no entry here.

# Codex Enact sessions default to Sol High for every spawned role.
[roles.executor.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.warden.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.steward.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.mason.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.sage.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.archivist.codex]
model = "gpt-6.1-sol"
effort = "high"

[roles.justiciar.codex]
model = "gpt-6.1-sol"
effort = "high"
