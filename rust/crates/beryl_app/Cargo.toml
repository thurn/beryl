[package]
name = "beryl_app"
version = "0.1.0"
description = "Project Beryl's desktop app: the Tauri shell around the engine"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "beryl_app"
crate-type = ["rlib"]

[[bin]]
name = "beryl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
beryl_session = { path = "../beryl_session" }
serde_json = "1.0.154"

# The window snapshot a bug report freezes (snapshot.rs): WKWebView's own, which needs no
# screen-recording permission.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

[lints]
workspace = true
