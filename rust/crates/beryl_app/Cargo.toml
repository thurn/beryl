[package]
name = "beryl_app"
version = "0.1.0"
description = "Project Beryl's desktop app: the Tauri shell around the engine"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "beryl_app"
# staticlib: the iOS app links the crate into its Xcode project (gen/apple); cdylib: the
# Android app loads it as a shared library (gen/android).
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "beryl"
path = "src/main.rs"

[features]
iroh = ["beryl_table_session/iroh"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Replaces nothing: the app never calls it. It turns on the `default` feature of
# `crossbeam-utils` (which Tauri uses) that the benchmarks' `criterion` turns on, so that
# `cargo test` and the checks' build of the workspace's libraries (`CLI_BUILD` in
# tools/src/beryl_tools/paths.py) compile Tauri and the app once, not once each.
crossbeam-utils = "0.8.23"
tauri = { version = "2", features = [] }
beryl_session = { path = "../beryl_session" }
# Runs the manual table and projects it onto the shared game-update event.
beryl_table_session = { path = "../beryl_table_session" }
# The manual-table actions used to deal the debug localhost pair.
beryl_table = { path = "../beryl_table" }
# Replaces the desktop search budget with the smaller phone budget in the app shell.
beryl_search = { path = "../beryl_search" }
# The card image cache and download queue behind the `beryl-art` URI scheme (art.rs).
beryl_art = { path = "../beryl_art" }
serde_json = "1.0.154"
# A bug report's images, cropped and encoded from the window snapshot (snapshot.rs).
png = "0.18"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
# The phone WebView snapshot and device details come from Swift and Kotlin.
beryl_mobile = { package = "beryl-mobile", path = "../beryl_mobile" }
# Bounds the wait for the native WebView without cancelling temporary-file cleanup.
tokio = { version = "1", features = ["time"] }

# The window snapshot a bug report freezes (snapshot.rs): WKWebView's own, which needs no
# screen-recording permission.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

# On Windows, WebView2's own snapshot (CapturePreview), at the versions Tauri's wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[dev-dependencies]
# Isolated report folders for the share path test.
tempfile = "3"

[lints]
workspace = true
