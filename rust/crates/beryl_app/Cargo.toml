[package]
name = "beryl_app"
version = "0.1.0"
description = "Project Beryl's desktop app: the Tauri shell around the engine"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "beryl_app"
crate-type = ["rlib"]

[[bin]]
name = "beryl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
