[package]
name = "beryl_app"
version = "0.1.0"
description = "Project Beryl's desktop app: the Tauri shell around the engine"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "beryl_app"
# staticlib: the iOS app links the crate into its Xcode project (gen/apple); cdylib: the
# Android app loads it as a shared library (gen/android).
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "beryl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
beryl_session = { path = "../beryl_session" }
serde_json = "1.0.154"
# A bug report's images, cropped and encoded from the window snapshot (snapshot.rs).
png = "0.18"

# Card art downloads (art.rs) over the system's TLS, except on Android, which has none a Rust
# crate can link: rustls there.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The window snapshot a bug report freezes (snapshot.rs): WKWebView's own, which needs no
# screen-recording permission.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

# On Windows, WebView2's own snapshot (CapturePreview), at the versions Tauri's wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[lints]
workspace = true
