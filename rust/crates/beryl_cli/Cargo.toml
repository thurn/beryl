[package]
name = "beryl_cli"
version = "0.1.0"
description = "Headless games and tournaments between agents, transcripts, and the UI fixtures recorded from sessions"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true


[dependencies]
# The card names and decklists, which change only when a card is added. The cards themselves
# come in as a `Catalog` from the binary (crates/beryl_cli_main), so that an edit to a card
# file recompiles none of this library.
beryl_card_names = { path = "../beryl_card_names" }
beryl_engine = { path = "../beryl_engine" }
beryl_scenario = { path = "../beryl_scenario" }
beryl_search = { path = "../beryl_search" }
beryl_session = { path = "../beryl_session" }
# Parses sample decks and fixture actions with the manual table's own schema.
beryl_table = { path = "../beryl_table" }
# Runs the manual table and projects it onto the shared game-update event.
beryl_table_session = { path = "../beryl_table_session" }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
# A search's rewards are logged and read back on resume: without exact float parsing a
# resumed game's decisions.jsonl drifts by an ulp once rewards are not multiples of 0.5.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Provides Win32 power throttling declarations in place of handwritten FFI.
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
# The integration tests' catalog (`tests/all/common.rs`): the commands played with every card.
beryl_cards = { path = "../beryl_cards", features = ["scenarios"] }
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
