[package]
name = "beryl_cli"
version = "0.1.0"
description = "Headless games and tournaments between agents, transcripts, and the UI fixtures recorded from sessions"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true


[dependencies]
# Specs, script checks and boards are built from the cards' scenarios.
beryl_cards = { path = "../beryl_cards", features = ["scenarios"] }
beryl_engine = { path = "../beryl_engine" }
beryl_scenario = { path = "../beryl_scenario" }
beryl_search = { path = "../beryl_search" }
beryl_session = { path = "../beryl_session" }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
# A search's rewards are logged and read back on resume: without exact float parsing a
# resumed game's decisions.jsonl drifts by an ulp once rewards are not multiples of 0.5.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3"
