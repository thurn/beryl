[package]
name = "beryl_search"
version = "0.1.0"
description = "The agents behind one trait: random, greedy and the rollout policy, and the searchers after them"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_cards = { path = "../beryl_cards" }
beryl_engine = { path = "../beryl_engine" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# The fuzz games' report of what they never reached.
beryl_engine = { path = "../beryl_engine", features = ["coverage"] }
beryl_scenario = { path = "../beryl_scenario" }
# Shrinks a failing fuzz game to the few choices that break it, where a failure was a whole
# game of hundreds of decisions; only the tests use it (plan K12), never the search itself.
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }

[[test]]
name = "allocations"
harness = false
