[package]
name = "beryl_shell"
version = "0.1.0"
description = "What both app shells share: profiles, data folders, bug report storage and resuming"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The card table type `sessions` takes.
beryl_engine = { path = "../beryl_engine" }
beryl_session = { path = "../beryl_session" }
serde_json = "1.0.154"

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
# Isolated data and report folders for the tests.
tempfile = "3"
# The decklist the resume test starts a game with, and its scenarios, as the whole workspace
# builds it, so that a build of this package's tests alone reuses the whole workspace's build.
beryl_cards = { path = "../beryl_cards", features = ["scenarios"] }

[lints]
workspace = true
