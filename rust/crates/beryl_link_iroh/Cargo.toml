[package]
name = "beryl_link_iroh"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Use the same frame transport interface as the in-memory and localhost links.
beryl_link = { path = "../beryl_link" }
# iroh supplies router traversal and an encrypted relay protocol instead of writing both by hand.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
# Drive iroh's async endpoint behind the blocking link interface.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Encode invite payloads in unpadded base32 without a custom codec.
data-encoding = "2"
# Generate cryptographic table secrets from the operating system.
getrandom = "0.4"
# Publish a complete private identity file without replacing a concurrent writer's key.
tempfile = "3"

[dev-dependencies]
# Supply the JSON value type required by the table handshake's test callbacks.
serde_json = "1"
