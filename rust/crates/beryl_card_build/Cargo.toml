[package]
name = "beryl_card_build"
version = "0.1.0"
description = "What a card crate's build script runs: the module tree, tables and names of its files"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# A build dependency of every set crate, the shared crate and the registry. It replaces the
# lists kept by hand: `beryl_cards`' `CARDS` and `SCENARIOS`, the color `mod.rs` files and the
# committed `names.rs` (plan K8: "A build script lists each set directory. No registry is kept
# by hand"), and the printed characteristics card files typed (plan K2).
[dependencies]
# The card store's reader, so a build script reads a record as the app does, in place of a
# second JSON parser.
beryl_card_store = { path = "../beryl_card_store" }
