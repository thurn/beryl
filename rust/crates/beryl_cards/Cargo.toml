[package]
name = "beryl_cards"
version = "0.1.0"
description = "The card definitions, the generated card names and the decklists"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The vocabulary a card's effect data is written in (plan K1).
beryl_card = { path = "../beryl_card" }
beryl_engine = { path = "../beryl_engine" }
# Behind the `scenarios` feature (plan, Crates): the scenarios' value types, all a card file's
# scenarios name, and the runner, for the rules library's scenarios, the generators and the
# dump binary.
beryl_scenario = { path = "../beryl_scenario", optional = true }
beryl_scenario_types = { path = "../beryl_scenario_types", optional = true }

[dev-dependencies]
# Tests read every card's scenarios: the crate's own, with the feature on.
beryl_cards = { path = ".", features = ["scenarios"] }
# The scenarios' ability coverage (architecture §17.3).
beryl_engine = { path = "../beryl_engine", features = ["coverage"] }
serde_json = "1"

[features]
# Every card's scenarios, the `SCENARIOS` table, the generated positions and the dump binary.
# Tests and tools turn it on; the app never does (plan, Crates: "Scenarios compile only for
# tests and tools").
scenarios = ["dep:beryl_scenario", "dep:beryl_scenario_types"]

[[bin]]
name = "beryl_scenario"
required-features = ["scenarios"]
