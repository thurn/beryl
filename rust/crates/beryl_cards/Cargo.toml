[package]
name = "beryl_cards"
version = "0.1.0"
description = "The generated registry over every set crate, the card names and the decklists"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The vocabulary a card's effect data is written in (plan K1).
beryl_card = { path = "../beryl_card" }
# The tokens and props card files share, re-exported here.
beryl_card_shared = { path = "../beryl_card_shared" }
beryl_engine = { path = "../beryl_engine" }
# Behind the `scenarios` feature (plan, Crates): the scenarios' value types, all a card file's
# scenarios name, and the runner, for the rules library's scenarios, the generators and the
# dump binary.
beryl_scenario = { path = "../beryl_scenario", optional = true }
beryl_scenario_types = { path = "../beryl_scenario_types", optional = true }
# The set crates, `rust/cards/*`: one per group of data/set-groups.json that has a card file.
# Cargo makes this the one list kept by hand, with the feature's below; the build script says
# so when a new crate is missing from either.
cards_1993_1994 = { path = "../../cards/cards_1993_1994" }
cards_1994_1996 = { path = "../../cards/cards_1994_1996" }
cards_1996_1998 = { path = "../../cards/cards_1996_1998" }
cards_1999_2000 = { path = "../../cards/cards_1999_2000" }
cards_2001_2002 = { path = "../../cards/cards_2001_2002" }
cards_2003_2005 = { path = "../../cards/cards_2003_2005" }
cards_2005_2007 = { path = "../../cards/cards_2005_2007" }
cards_2007_2009 = { path = "../../cards/cards_2007_2009" }
cards_2009_2011 = { path = "../../cards/cards_2009_2011" }
cards_2011_2013 = { path = "../../cards/cards_2011_2013" }
cards_2013_2014 = { path = "../../cards/cards_2013_2014" }
cards_2014_2016 = { path = "../../cards/cards_2014_2016" }
cards_2016_2017 = { path = "../../cards/cards_2016_2017" }
cards_2018_2019 = { path = "../../cards/cards_2018_2019" }
cards_2019_2020 = { path = "../../cards/cards_2019_2020" }
cards_2020_2021 = { path = "../../cards/cards_2020_2021" }
cards_2021_2022 = { path = "../../cards/cards_2021_2022" }
cards_2022 = { path = "../../cards/cards_2022" }
cards_2022_2023 = { path = "../../cards/cards_2022_2023" }
cards_2023_2024 = { path = "../../cards/cards_2023_2024" }
cards_2024_2025 = { path = "../../cards/cards_2024_2025" }
cards_2025 = { path = "../../cards/cards_2025" }
cards_2025_2026 = { path = "../../cards/cards_2025_2026" }
cards_2026 = { path = "../../cards/cards_2026" }

[build-dependencies]
# Lists the set crates and writes the tables over them (plan K8).
beryl_card_build = { path = "../beryl_card_build" }

[dev-dependencies]
# Tests read every card's scenarios: the crate's own, with the feature on.
beryl_cards = { path = ".", features = ["scenarios"] }
# The scenarios' ability coverage (architecture §17.3).
beryl_engine = { path = "../beryl_engine", features = ["coverage"] }
serde_json = "1"

[features]
# Every card's scenarios, the `SCENARIOS` table, the generated positions and the dump binary.
# Tests and tools turn it on; the app never does (plan, Crates: "Scenarios compile only for
# tests and tools").
scenarios = [
    "dep:beryl_scenario",
    "dep:beryl_scenario_types",
    "cards_1993_1994/scenarios",
    "cards_1994_1996/scenarios",
    "cards_1996_1998/scenarios",
    "cards_1999_2000/scenarios",
    "cards_2001_2002/scenarios",
    "cards_2003_2005/scenarios",
    "cards_2005_2007/scenarios",
    "cards_2007_2009/scenarios",
    "cards_2009_2011/scenarios",
    "cards_2011_2013/scenarios",
    "cards_2013_2014/scenarios",
    "cards_2014_2016/scenarios",
    "cards_2016_2017/scenarios",
    "cards_2018_2019/scenarios",
    "cards_2019_2020/scenarios",
    "cards_2020_2021/scenarios",
    "cards_2021_2022/scenarios",
    "cards_2022/scenarios",
    "cards_2022_2023/scenarios",
    "cards_2023_2024/scenarios",
    "cards_2024_2025/scenarios",
    "cards_2025/scenarios",
    "cards_2025_2026/scenarios",
    "cards_2026/scenarios",
]

[[bin]]
name = "beryl_scenario"
required-features = ["scenarios"]
