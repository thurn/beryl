[package]
name = "beryl_cards"
version = "0.1.0"
description = "The card definitions, the generated card names and the decklists"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_engine = { path = "../beryl_engine" }
beryl_scenario = { path = "../beryl_scenario" }

[dev-dependencies]
# The scenarios' ability coverage (architecture §17.3).
beryl_engine = { path = "../beryl_engine", features = ["coverage"] }
serde_json = "1"
