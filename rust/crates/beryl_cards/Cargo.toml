[package]
name = "beryl_cards"
version = "0.1.0"
description = "The generated registry over every set crate, the card names and the decklists"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The vocabulary a card's effect data is written in.
beryl_card = { path = "../beryl_card" }
# The tokens and props card files share, re-exported here.
beryl_card_shared = { path = "../beryl_card_shared" }
beryl_engine = { path = "../beryl_engine" }
# Behind the `scenarios` feature: the scenarios' value types, all a card file's
# scenarios name, and the runner, for the rules library's scenarios, the generators and the
# dump binary.
beryl_scenario = { path = "../beryl_scenario", optional = true }
beryl_scenario_types = { path = "../beryl_scenario_types", optional = true }
# The set crates, `rust/cards/*`: one per group of data/set-groups.json that has a card file.
# Cargo makes this the one list kept by hand, with the feature's below; the build script says
# so when a new crate is missing from either.
cards_1993 = { path = "../../cards/cards_1993" }
cards_1994 = { path = "../../cards/cards_1994" }
cards_1995 = { path = "../../cards/cards_1995" }
cards_1996 = { path = "../../cards/cards_1996" }
cards_1997 = { path = "../../cards/cards_1997" }
cards_1998 = { path = "../../cards/cards_1998" }
cards_1999 = { path = "../../cards/cards_1999" }
cards_2000 = { path = "../../cards/cards_2000" }
cards_2001 = { path = "../../cards/cards_2001" }
cards_2002 = { path = "../../cards/cards_2002" }
cards_2003 = { path = "../../cards/cards_2003" }
cards_2004 = { path = "../../cards/cards_2004" }
cards_2005 = { path = "../../cards/cards_2005" }
cards_2006 = { path = "../../cards/cards_2006" }
cards_2007 = { path = "../../cards/cards_2007" }
cards_2008 = { path = "../../cards/cards_2008" }
cards_2009 = { path = "../../cards/cards_2009" }
cards_2010 = { path = "../../cards/cards_2010" }
cards_2011 = { path = "../../cards/cards_2011" }
cards_2012 = { path = "../../cards/cards_2012" }
cards_2013 = { path = "../../cards/cards_2013" }
cards_2014 = { path = "../../cards/cards_2014" }
cards_2015 = { path = "../../cards/cards_2015" }
cards_2016 = { path = "../../cards/cards_2016" }
cards_2017 = { path = "../../cards/cards_2017" }
cards_2018 = { path = "../../cards/cards_2018" }
cards_2019_h1 = { path = "../../cards/cards_2019_h1" }
cards_2019_h2 = { path = "../../cards/cards_2019_h2" }
cards_2020_h1 = { path = "../../cards/cards_2020_h1" }
cards_2020_h2 = { path = "../../cards/cards_2020_h2" }
cards_2021_h1 = { path = "../../cards/cards_2021_h1" }
cards_2021_h2 = { path = "../../cards/cards_2021_h2" }
cards_2022_h1 = { path = "../../cards/cards_2022_h1" }
cards_2022_h2 = { path = "../../cards/cards_2022_h2" }
cards_2023_h1 = { path = "../../cards/cards_2023_h1" }
cards_2023_h2 = { path = "../../cards/cards_2023_h2" }
cards_2024_h1 = { path = "../../cards/cards_2024_h1" }
cards_2024_h2 = { path = "../../cards/cards_2024_h2" }
cards_2025_h1 = { path = "../../cards/cards_2025_h1" }
cards_2025_h2 = { path = "../../cards/cards_2025_h2" }
cards_2026_q1 = { path = "../../cards/cards_2026_q1" }
cards_2026_q2 = { path = "../../cards/cards_2026_q2" }
cards_2026_q3 = { path = "../../cards/cards_2026_q3" }
cards_2026_q4 = { path = "../../cards/cards_2026_q4" }

[build-dependencies]
# Lists the set crates and writes the tables over them.
beryl_card_build = { path = "../beryl_card_build" }

[dev-dependencies]
# Tests read every card's scenarios: the crate's own, with the feature on.
beryl_cards = { path = ".", features = ["scenarios"] }
# The scenarios' ability coverage (architecture §17.3).
beryl_engine = { path = "../beryl_engine", features = ["coverage"] }
serde_json = "1"

[features]
# Every card's scenarios, the `SCENARIOS` table, the generated positions and the dump binary.
# Tests and tools turn it on; the app never does.
scenarios = [
    "dep:beryl_scenario",
    "dep:beryl_scenario_types",
    "cards_1993/scenarios",
    "cards_1994/scenarios",
    "cards_1995/scenarios",
    "cards_1996/scenarios",
    "cards_1997/scenarios",
    "cards_1998/scenarios",
