[package]
name = "beryl_session"
version = "0.1.0"
description = "Game sessions: a game on its own thread, the PlayerView protocol and replay files"
edition.workspace = true
license.workspace = true
publish = false
# The integration tests are one binary, tests/main.rs, which says why.
autotests = false

[lints]
workspace = true

[dependencies]
# The renderer (`beryl_card::render`) writes an ability's rules text where its card prints none.
beryl_card = { path = "../beryl_card" }
beryl_card_store = { path = "../beryl_card_store" }
beryl_cards = { path = "../beryl_cards" }
beryl_engine = { path = "../beryl_engine" }
beryl_search = { path = "../beryl_search" }
# The frozen save corpus is gzipped (`corpus`): a save's JSON shrinks twentyfold.
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# A prompt's purpose is written by its name (`purpose_name`), with its TypeScript type
# given by hand: ts-rs would warn that it cannot read that serde attribute.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The tests play cards' scenarios.
beryl_cards = { path = "../beryl_cards", features = ["scenarios"] }
beryl_scenario = { path = "../beryl_scenario" }
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }

[[test]]
name = "session"
path = "tests/main.rs"
