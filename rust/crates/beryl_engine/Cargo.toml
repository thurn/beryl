[package]
name = "beryl_engine"
version = "0.1.0"
description = "The facade other crates import: the rules and the kernel under one name"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_kernel = { path = "../beryl_kernel" }
beryl_rules = { path = "../beryl_rules" }

[features]
# Records which abilities a game exercised (`beryl_rules`' `coverage`), for the card tests.
coverage = ["beryl_rules/coverage"]
