[package]
name = "beryl_link"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Use the same DEFLATE codec as beryl_session instead of implementing compression.
flate2 = "1.1.10"
# Derive the wire envelope and keep table values opaque instead of hand-parsing JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
