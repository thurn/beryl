[package]
name = "beryl_table_session"
version = "0.1.0"
description = "Adapts a manual table to player views and game sessions"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
iroh = ["dep:beryl_link_iroh"]

[dependencies]
# Supplies printed records and exact token printing keys for manual views.
beryl_card_records = { path = "../beryl_card_records" }
# Supplies printed characteristics without asking the engine to interpret a card.
beryl_card_store = { path = "../beryl_card_store" }
# Transports manual table updates and actions between seats.
beryl_link = { path = "../beryl_link" }
# Traverses home routers and uses encrypted relays for internet play.
beryl_link_iroh = { path = "../beryl_link_iroh", optional = true }
# Supplies the view protocol shared with engine games.
beryl_protocol = { path = "../beryl_protocol" }
# Supplies host-side state, action permissions and per-seat redaction.
beryl_table = { path = "../beryl_table" }
# Encodes session messages using the same format as the game protocol.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Stages a replacement header beside a save for atomic guest reservation.
tempfile = "3"
# Validates the relay setting before writing it, including in builds without iroh.
url = "2"

[dev-dependencies]
# Verifies that manual and engine sessions share one ID sequence.
beryl_session = { path = "../beryl_session" }
