[package]
name = "beryl_art"
version = "0.1.0"
description = "Card images from Scryfall: the disk cache and the rate-limited download queue"
edition.workspace = true
license.workspace = true
publish = false

# Downloads use the system's TLS, except on Android, which has none a Rust crate can link:
# rustls there.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
