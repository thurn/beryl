[package]
name = "beryl_bench"
version = "0.1.0"
description = "Benchmark support: deterministic inputs, core placement and ABBA timing"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
criterion = "0.8.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "example_timing"
harness = false

[[bench]]
name = "example_abba"
harness = false

[[bench]]
name = "example_counts"
harness = false
