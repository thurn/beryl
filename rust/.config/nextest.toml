# The rust lane's profile (tools/src/beryl_tools/checks.py, rust_tests_step): each test's
# outcome and time as JUnit XML, which the run log reads.
[profile.check.junit]
path = "junit.xml"

# Ignite's `rust` family (ignite/checks/rust.toml): the same JUnit report in its own directory,
# target/nextest/ignite/junit.xml, so that a run of it never overwrites the rust lane's.
[profile.ignite.junit]
path = "junit.xml"
