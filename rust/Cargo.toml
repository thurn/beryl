[workspace]
resolver = "3"
members = ["crates/*", "cards/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
# Every warning is an error, in every build: clippy only checks a debug build with every feature
# on, so a warning that only a release build or a build without `scenarios` sees would otherwise
# reach the release build's output and stay there.
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Every set crate's build script reads the whole card store, and the scale rehearsal's one-card
# rebuild (`just scale`) waits for one: unoptimized, the build helper took 1.5 s to read a 36 MiB
# store. These are compiled once and change rarely.
[profile.dev.package.beryl_card_build]
opt-level = 3
[profile.dev.package.beryl_card_store]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# Benchmarks and headless research binaries (architecture §18). Recipes that build it pass
# `-C target-cpu=apple-m4`, which a profile cannot set; the app keeps `release`.
[profile.search]
inherits = "release"
lto = "fat"
panic = "abort"
codegen-units = 1

# `cargo test` (the rust lane's tests step, `just test-rust`) at opt-level 1. Unoptimized, the
# workspace's tests took about 437 test-seconds, 27 s on the clock at load 40 on 18 cores, and
# the step took 44 s after a kernel change, most of the fast check's 60 s budget; at opt-level 1
# they take 2.6 s and the step 17 s, with no slower build. Debug assertions and overflow checks
# stay on, as `dev` has them.
[profile.test]
opt-level = 1
debug = 2

# The card build helpers and their dependencies are both build-time and normal
# libraries in a workspace test. They can be build-only in a package test. Use the
# same optimization and debug info for both roles so Cargo can reuse the libraries
# and every crate that depends on them.
[profile.test.build-override]
opt-level = 1
debug = 2

[patch.crates-io]
# iOS needs netwatch's fix for the routing constants libc exposes only on
# macOS. Remove this patch once a published netwatch release includes it.
netwatch = { git = "https://github.com/n0-computer/net-tools", rev = "c8d6e3efdb65e038451738cea63e327d9b4cbeaf" }
