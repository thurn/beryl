[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# Benchmarks and headless research binaries (architecture §18). Recipes that build it pass
# `-C target-cpu=apple-m4`, which a profile cannot set; the app keeps `release`.
[profile.search]
inherits = "release"
lto = "fat"
panic = "abort"
codegen-units = 1
