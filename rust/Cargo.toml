[workspace]
resolver = "3"
members = ["crates/*", "cards/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# A bug report encodes a retina window to PNG (beryl_app's snapshot.rs): unoptimized, that held
# a dev build's report for seconds. Optimizing these few dependencies costs no build time of ours.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# Benchmarks and headless research binaries (architecture §18). Recipes that build it pass
# `-C target-cpu=apple-m4`, which a profile cannot set; the app keeps `release`.
[profile.search]
inherits = "release"
lto = "fat"
panic = "abort"
codegen-units = 1
