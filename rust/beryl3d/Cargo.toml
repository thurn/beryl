# Beryl 3D's Cargo workspace: the native 3D client (docs/beryl-3d.md). It is separate from the
# main workspace in ../Cargo.toml so that no check of the main workspace builds it and a change
# here selects no main lane. Its crates depend on the main crates by path. `lints-match`
# (`just b3d lane`) keeps the lint tables below equal to the main workspace's.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
# Every warning is an error, in every build: clippy only checks a debug build with every feature
# on, so a warning that only a release build or a build without `scenarios` sees would otherwise
# reach the release build's output and stay there.
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Debug builds keep line tables only, and leave them in the object files, so that linking is
# faster. After a one-line edit to `beryl_scene`, `just b3d tree` took a median of 11.9 s with
# Cargo's defaults and 8.5 s with these (docs/beryl-3d.md, "Edit-to-output time").
#
# No LTO at all. At opt-level 2 rustc otherwise runs ThinLTO across a crate's own codegen units,
# and after a one-line edit to `beryl_scene` that pass took 1.8 to 2.1 s of the crate's 3.2 to
# 3.5 s compile, and rebuilding `b3d` took 4.1 to 4.5 s; without it, 1.6 to 2.5 s. The interface
# tests run 30% slower without it, so the `test` profile below keeps it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
lto = "off"

# The card crates' build scripts read the whole card store, as the main workspace's do.
[profile.dev.package.beryl_card_build]
opt-level = 3
[profile.dev.package.beryl_card_store]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
# Deflates the recordings pack when it is built, about 260 MB of JSON.
[profile.dev.package.miniz_oxide]
opt-level = 3

# The client core and the inspector at opt-level 2. Unoptimized, every interface test
# (`just b3d test`) took about 270 CPU-seconds; at opt-level 2 it takes about 110. The rebuild
# after a one-line edit to `beryl_scene` stays about 2 s. Optimizing the session crates as well
# saved nothing more.
[profile.dev.package.beryl_scene]
opt-level = 2
[profile.dev.package.beryl_inspect]
opt-level = 2

# Every dependency at opt-level 1. None of them is rebuilt after an edit to this workspace's
# crates, and optimized they make `b3d-render` 28 MB instead of 74, which links faster, passes
# macOS's check of a new executable faster and draws its picture in 0.4 CPU-seconds instead of
# 0.7. A cold build of its dependencies took 2 minutes 18 seconds at load 70, paid once per
# change to a dependency (docs/beryl-3d.md, "Edit-to-output time").
[profile.dev.package."*"]
opt-level = 1
# The face encoders and the scaler they use, at opt-level 3. `just b3d png` compresses a
# placeholder on every run for each face whose scan is missing, since placeholders are never
# cached: unoptimized, 11 placeholders took 1.4 s of the program's 2.6 CPU-seconds.
[profile.dev.package.ctt]
opt-level = 3
[profile.dev.package.ctt-astcenc]
opt-level = 3
[profile.dev.package.ctt-bc7f]
opt-level = 3
[profile.dev.package.ctt-etcpak]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# `cargo test` (the rust lane's tests step, `just test-rust`) at opt-level 1. Unoptimized, the
# workspace's tests took about 437 test-seconds, 27 s on the clock at load 40 on 18 cores, and
# the step took 44 s after a kernel change, most of the fast check's 60 s budget; at opt-level 1
# they take 2.6 s and the step 17 s, with no slower build. Debug assertions and overflow checks
# stay on, as `dev` has them.
#
# `lto = false` is Cargo's default, ThinLTO across each crate's own codegen units, which `dev`
# turns off. Every interface test (`b3d test`) took 148 CPU-seconds with it and 195 without.
[profile.test]
opt-level = 1
lto = false
