# Beryl 3D's Cargo workspace: the native 3D client (docs/beryl-3d.md). It is separate from the
# main workspace in ../Cargo.toml so that no check of the main workspace builds it and a change
# here selects no main lane. Its crates depend on the main crates by path. `lints-match`
# (`just b3d lane`) keeps the lint tables below equal to the main workspace's.
[workspace]
resolver = "3"
members = [
    "crates/beryl_3d",
    "crates/beryl_assets",
    "crates/beryl_host",
    "crates/beryl_inspect",
    "crates/beryl_pictures",
    "crates/beryl_record",
    "crates/beryl_render",
    "crates/beryl_scene",
    "crates/kit_base",
    "crates/kit_text",
    "crates/kit_frame",
    "crates/kit_ui",
    "crates/kit_space",
    "crates/kit_fx",
    "crates/kit_scene",
    "crates/kit_probe",
    "crates/game_table",
    "crates/game_play",
    "crates/game_hud",
    "crates/game_manual",
    "crates/game_probe",
    "crates/app_screens",
    "crates/app_client",
    "crates/scaffold_web",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# The protocol types still carried by the scene and its frame records.
beryl_protocol = { path = "../crates/beryl_protocol" }
# Stores a bounded track without initializing or cloning its unused segment slots.
arrayvec = "0.7.8"
# Lets the renderer upload draw records as bytes without hand-written unsafe casts.
bytemuck = { version = "1.25.2", features = ["derive"] }
# Vector and matrix math for poses and the camera, in place of hand-written math.
glam = "0.34.3"
# Shapes and breaks text into lines without hand-written layout or system font discovery.
parley = { version = "0.13.0", default-features = false, features = ["std"] }
# Lays out text and 2D regions as flexbox and grid, in place of hand-written layout.
taffy = "0.15.1"
# Reads configuration and protocol data without hand-written parsers.
serde_json = "1.0.154"

# Ids, vectors, `Pose`, curves, design tokens, the data store.
kit_base = { path = "crates/kit_base" }
# Shaping, line breaking, glyph requests.
kit_text = { path = "crates/kit_text" }
# `Frame`, `Draw` and `Material`: everything a renderer reads.
kit_frame = { path = "crates/kit_frame" }
# Elements, styles, flexbox and grid layout, widgets, focus, text entry, transitions, scrolling.
kit_ui = { path = "crates/kit_ui" }
# Objects in table space, the camera, tracks, containers and the arrangement solver.
kit_space = { path = "crates/kit_space" }
# Effect primitives, the effect player, lines and outlines between nodes.
kit_fx = { path = "crates/kit_fx" }
# The one tree: nodes, relations, the solve order, paint order, hit testing, input routing, the `Feature` trait.
kit_scene = { path = "crates/kit_scene" }
# The tree printout, locators, actions, the interface checks, toolkit stories.
kit_probe = { path = "crates/kit_probe" }
# Each zone as a container, for each profile: rows, hands, the stack, piles, trays, badges.
game_table = { path = "crates/game_table" }
# Scripts compiled to tracks; verbs, beats, notices, sound cues, arrows and marks.
game_play = { path = "crates/game_play" }
# The game screen's features: prompts, life totals, the log, the inspector, the pile viewer, the opening hand, the result.
game_hud = { path = "crates/game_hud" }
# The manual table and its lobby.
game_manual = { path = "crates/game_manual" }
# Replaying recordings, table and feature stories, the checks that read scripts.
game_probe = { path = "crates/game_probe" }
# The screens with no game: start, settings, bug report, the story browser, testing.
app_screens = { path = "crates/app_screens" }
# `Client`: the feature registry, routing, session commands, settings.
app_client = { path = "crates/app_client" }
# Fitting rows and piles to the web interface's positions; deleted at the switch.
scaffold_web = { path = "crates/scaffold_web" }

# Stores small erased action messages inline, in place of allocating each control's message.
smallbox = "0.8.8"

[workspace.lints.rust]
unsafe_code = "deny"
# Every warning is an error, in every build: clippy only checks a debug build with every feature
# on, so a warning that only a release build or a build without `scenarios` sees would otherwise
# reach the release build's output and stay there.
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Debug builds keep line tables only, and leave them in the object files, so that linking is
# faster. After a one-line edit to `beryl_scene`, `just b3d tree` took a median of 11.9 s with
# Cargo's defaults and 8.5 s with these (docs/beryl-3d.md, "Edit-to-output time").
#
# No LTO at all. At opt-level 2 rustc otherwise runs ThinLTO across a crate's own codegen units,
# and after a one-line edit to `beryl_scene` that pass took 1.8 to 2.1 s of the crate's 3.2 to
# 3.5 s compile, and rebuilding `b3d` took 4.1 to 4.5 s; without it, 1.6 to 2.5 s. The interface
# tests run 30% slower without it, so the `test` profile below keeps it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
lto = "off"

# The card crates' build scripts read the whole card store, as the main workspace's do.
[profile.dev.package.beryl_card_build]
opt-level = 3
[profile.dev.package.beryl_card_store]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
# Deflates the recordings pack when it is built, about 260 MB of JSON.
[profile.dev.package.miniz_oxide]
opt-level = 3

# The client core and the inspector at opt-level 2. Unoptimized, every interface test
# (`just b3d test`) took about 270 CPU-seconds; at opt-level 2 it takes about 110. The rebuild
# after a one-line edit to `beryl_scene` stays about 2 s. Optimizing the session crates as well
# saved nothing more.
[profile.dev.package.beryl_scene]
opt-level = 2
[profile.dev.package.beryl_inspect]
opt-level = 2
# `just b3d match pixels` walks every pixel of two 3200 by 1800 pictures several times.
# Unoptimized it took 2.2 CPU-seconds on a desktop target, and at opt-level 2 it takes 1.0; the
# crate is small, so the program still rebuilds in about a second after an edit.
[profile.dev.package.beryl_pictures]
opt-level = 2

# Every dependency at opt-level 1. None of them is rebuilt after an edit to this workspace's
# crates, and optimized they make `b3d-render` 28 MB instead of 74, which links faster, passes
# macOS's check of a new executable faster and draws its picture in 0.4 CPU-seconds instead of
# 0.7. A cold build of its dependencies took 2 minutes 18 seconds at load 70, paid once per
# change to a dependency (docs/beryl-3d.md, "Edit-to-output time").
[profile.dev.package."*"]
opt-level = 1
# After an engine revision, reused incremental codegen units in the main workspace's path
# dependencies left missing `_anon.*.llvm.*` symbols at the native link. Compile each changed
# dependency in full; Cargo still reuses unchanged crates. `test` inherits this override.
# Native members such as `beryl_scene` keep incremental compilation for quick edits.
# Registry crates already build without it, so the wildcard needs no maintained package list.
incremental = false
# The crates between the card crates and `record` keep incremental compilation all the same.
# Every edit to a card file recompiles them, and compiled in full they took about 120 of the
# build's 160 CPU-seconds and 45 s on the clock; incrementally they take a few seconds, as they
# do in the main workspace, which compiles them so at the same opt-level. If a link fails again
# with missing `_anon.*.llvm.*` symbols, delete these crates' directories under
# `target/debug/incremental` and record it in docs/bugs.md.
[profile.dev.package.beryl_search]
incremental = true
[profile.dev.package.beryl_session]
incremental = true
[profile.dev.package.beryl_cli]
incremental = true
# The face encoders and the scaler they use, at opt-level 3. `just b3d png` compresses a
# placeholder on every run for each face whose scan is missing, since placeholders are never
# cached: unoptimized, 11 placeholders took 1.4 s of the program's 2.6 CPU-seconds.
[profile.dev.package.ctt]
opt-level = 3
[profile.dev.package.ctt-astcenc]
opt-level = 3
[profile.dev.package.ctt-bc7f]
opt-level = 3
[profile.dev.package.ctt-etcpak]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# `cargo test` (the rust lane's tests step, `just test-rust`) at opt-level 1. Unoptimized, the
# workspace's tests took about 437 test-seconds, 27 s on the clock at load 40 on 18 cores, and
# the step took 44 s after a kernel change, most of the fast check's 60 s budget; at opt-level 1
# they take 2.6 s and the step 17 s, with no slower build. Debug assertions and overflow checks
# stay on, as `dev` has them.
#
# `lto = false` is Cargo's default, ThinLTO across each crate's own codegen units, which `dev`
# turns off. Every interface test (`b3d test`) took 148 CPU-seconds with it and 195 without.
[profile.test]
opt-level = 1
lto = false
