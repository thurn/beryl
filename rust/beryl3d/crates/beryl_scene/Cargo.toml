[package]
name = "beryl_scene"
version = "0.1.0"
description = "Beryl 3D's scene: poses, layout and animation as pure data, with no GPU, window, clock or thread"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Code that only a driver of the scene (the inspector, a test) needs: the test driver and the
# builders of `testing`.
driver = ["dep:serde", "dep:serde_json"]

[dependencies]
# The game state the scene shows: PlayerView and the table commands.
beryl_protocol = { path = "../../../crates/beryl_protocol" }
# Lets the renderer upload draw records as bytes with no unsafe cast of its own.
bytemuck = { version = "1.25.2", features = ["derive"] }
# Vector and matrix math for poses and the camera, in place of hand-written math.
glam = "0.34.3"
# Lays out text and 2D regions as flexbox and grid, in place of hand-written layout.
taffy = "0.15.1"
# Shapes and breaks lines of text, in place of hand-written text layout. Without its default
# `system` feature, so no system font can be found or used.
parley = { version = "0.13.0", default-features = false, features = ["std"] }
# The driver reads a recording's views and responses, and writes requests to match them, as JSON,
# in place of a hand-written reader. Only the `driver` feature needs them.
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
# The crate itself with the `driver` feature, for the `testing` builders its tests use.
beryl_scene = { path = ".", features = ["driver"] }
# The card store's records for the cards a test's views name, which the scene draws faces from.
# It links no engine or cards.
beryl_card_records = { path = "../../../crates/beryl_card_records" }

[build-dependencies]
# Reads data/beryl3d/space.json and gates.json at build time, in place of a hand-written parser.
serde_json = "1.0.154"
