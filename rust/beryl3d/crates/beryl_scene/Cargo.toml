[package]
name = "beryl_scene"
version = "0.1.0"
description = "Beryl 3D's scene: poses, layout and animation as pure data, with no GPU, window, clock or thread"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Code that only a driver of the scene (the inspector, a test) needs: the test driver and the
# builders of `testing`.
driver = ["dep:serde", "game_play/driver"]

[dependencies]
game_play.workspace = true
game_table.workspace = true
kit_base.workspace = true
kit_frame.workspace = true
kit_fx.workspace = true
kit_probe.workspace = true
kit_scene.workspace = true
kit_text.workspace = true
kit_ui.workspace = true
kit_space.workspace = true
# The game state the scene shows: PlayerView and the table commands.
beryl_protocol.workspace = true
glam.workspace = true
# The manual table builds and reads table commands as JSON values, and the driver reads a
# recording's views and responses and writes requests to match them, in place of a hand-written
# reader. Only the `driver` feature needs `serde` itself.
serde = { version = "1.0.229", optional = true }
serde_json.workspace = true

[dev-dependencies]
# Opens repository files and records each read, so Ignite reruns the tests when one changes.
beryl_test_files = { path = "../../../crates/beryl_test_files" }
# The crate itself with the `driver` feature, for the `testing` builders its tests use.
beryl_scene = { path = ".", features = ["driver"] }
# The card store's records for the cards a test's views name, which the scene draws faces from.
# It links no engine or cards.
beryl_card_records = { path = "../../../crates/beryl_card_records" }

[build-dependencies]
# Reads audio credits and manual table commands at build time.
serde_json.workspace = true
