[package]
name = "game_probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Authored stories build synthetic protocol views. Only tools and tests need them.
stories = ["beryl_protocol/testing"]

[dependencies]
beryl_protocol.workspace = true
glam.workspace = true
serde_json.workspace = true
kit_base.workspace = true
kit_text.workspace = true
kit_frame.workspace = true
kit_ui.workspace = true
kit_space.workspace = true
kit_fx.workspace = true
kit_scene.workspace = true
kit_probe.workspace = true
game_table.workspace = true
game_play.workspace = true
game_hud.workspace = true
game_manual.workspace = true

[dev-dependencies]
# Test the story parser without turning on synthetic views in the live client.
game_probe = { path = ".", features = ["stories"] }
# Builds synthetic views and scripts for game probe tests.
beryl_protocol = { workspace = true, features = ["testing"] }
# Reads the web audio manifest to verify that both clients use the same cue names.
beryl_test_files = { path = "../../../crates/beryl_test_files" }
