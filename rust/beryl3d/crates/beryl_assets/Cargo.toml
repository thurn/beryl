[package]
name = "beryl_assets"
version = "0.1.0"
description = "Beryl 3D's assets: card pictures decoded and packed for the renderer"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# `decklist_faces`, which lists a match's faces from its decklists through the card records of
# `beryl_session`, and so links the engine and every card. A recording's pages carry their own
# face lists, so `b3d-render` leaves it off and links no engine (docs/beryl-3d.md,
# "Edit-to-output time").
decklists = ["dep:beryl_session"]

[dependencies]
beryl_scene = { path = "../beryl_scene" }
# The scan cache and Scryfall's download queue, shared with the Tauri app.
beryl_art = { path = "../../../crates/beryl_art" }
# Each card's printing, faces and tokens, from which a decklist's faces are listed.
beryl_session = { path = "../../../crates/beryl_session", optional = true }
# Compresses faces to ASTC, ETC2 and BC7 with their mipmaps, in place of hand-written texture
# encoders. Default features off: they add encoders that link prebuilt ISPC kernels, which do not
# exist for iOS or Android (docs/beryl-3d.md, "Card faces").
ctt = { version = "=0.6.1", default-features = false, features = ["encoder-astcenc", "encoder-etcpak", "encoder-bc7f"] }
# Decodes JPEG card scans and PNG pictures, in place of hand-written decoders.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Rasterizes glyph outlines to coverage bitmaps, in place of a hand-written TrueType and CFF
# rasterizer. Pinned to the release the cross-target probe built for every platform.
swash = "=0.2.10"

[dev-dependencies]
# The crate itself with `decklists`, whose faces the tests prepare.
beryl_assets = { path = ".", features = ["decklists"] }
# The WU Control list, whose faces the tests prepare.
beryl_cards = { path = "../../../crates/beryl_cards" }
