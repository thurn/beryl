[package]
name = "beryl_host"
version = "0.1.0"
description = "Beryl 3D's host: the window and event loop that drive a scene and render it"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# `Headless`, which plays a recording through the test driver and draws its frames offscreen.
headless = ["dep:game_probe"]
# `--drive`, which plays a script of actions through the frame loop. Only a debug build of the
# app has it.
drive = ["dep:game_probe"]

[dependencies]
kit_scene.workspace = true
app_client.workspace = true
app_screens.workspace = true
game_table.workspace = true
kit_base.workspace = true
kit_frame.workspace = true
kit_probe.workspace = true
kit_ui.workspace = true
# The scan cache and download queue the asset workers read card pictures from. The app links it
# already, through beryl_assets.
beryl_art = { path = "../../../crates/beryl_art" }
# The shapes of light every host uploads as the atlas's page 0 before its first frame, and the
# asset workers that prepare every host's card faces. The app links it already, through beryl_3d.
beryl_assets = { path = "../beryl_assets" }
beryl_render = { path = "../beryl_render" }
game_probe = { workspace = true, optional = true }
# Pointer positions as the client's vectors.
glam = "0.34.3"

[dev-dependencies]
# Reads the tuning fixtures and records their paths for Ignite.
beryl_test_files = { path = "../../../crates/beryl_test_files" }
# Supplies face records from sample decks to the asset preparation tests.
beryl_card_records = { path = "../../../crates/beryl_card_records" }
# Encodes a synthetic JPEG for the asset preparation tests.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Builds synthetic game views for offscreen host tests and supplies empty card records.
beryl_protocol = { workspace = true, features = ["testing"] }

# The desktop window and its events, in place of hand-written platform windowing. The phones
# have native Swift and Kotlin hosts instead (decision C7), which call `phone::Phone`.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
winit = "0.30.13"
# The system clipboard that a text field copies to and pastes from (src/clipboard.rs), in place of
# hand-written pasteboard calls. Without its default `image-data` feature: only text is copied.
arboard = { version = "3.4.1", default-features = false }

# The display link that asks macOS for the display's highest refresh rate (src/macos.rs): winit
# and wgpu offer none, and without one the prototype's window ran at 60 Hz on a 120 Hz display.
# These replace hand-written Objective-C message sends.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSRunLoop"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CADisplayLink", "CAFrameRateRange"] }

# Each thread's scheduling class (pthread_set_qos_class_self_np on Apple platforms,
# SetThreadPriority on Windows; src/threads.rs), in place of hand-written declarations of the C
# functions.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.191"

# Each thread's nice value on Android (setpriority and getpriority; src/threads.rs) and the
# logcat line that reports it (__android_log_write), in place of hand-written declarations of
# the C functions. The releases beryl_3d already links on Android.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.191"
ndk-sys = "0.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
