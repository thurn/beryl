[package]
name = "beryl_host"
version = "0.1.0"
description = "Beryl 3D's host: the window and event loop that drive a scene and render it"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_render = { path = "../beryl_render" }
beryl_scene = { path = "../beryl_scene" }
# Pointer positions as the client's vectors.
glam = "0.34.3"
# The desktop window and its events, in place of hand-written platform windowing.
winit = "0.30.13"

# The display link that asks macOS for the display's highest refresh rate (src/macos.rs): winit
# and wgpu offer none, and without one the prototype's window ran at 60 Hz on a 120 Hz display.
# These replace hand-written Objective-C message sends.
[target.'cfg(target_os = "macos")'.dependencies]
# The frame thread's scheduling class (pthread_set_qos_class_self_np), in place of a
# hand-written declaration of the C function.
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSRunLoop"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CADisplayLink", "CAFrameRateRange"] }

