[package]
name = "beryl_record"
version = "0.1.0"
description = "Beryl 3D's recorder: plays the engine to build the recordings pack that beryl_inspect reads"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "record"
path = "src/main.rs"

[dependencies]
# The pack's format, its sources and where it is kept.
beryl_inspect = { path = "../beryl_inspect" }
# Records the fixtures and card spec moments the recordings pack holds, with the code the web
# interface's fixtures are recorded with, in place of a second recorder.
beryl_cli = { path = "../../../crates/beryl_cli" }
# The card records each recording is headed by (`card_records::fixture_message`).
beryl_session = { path = "../../../crates/beryl_session" }
