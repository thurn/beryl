[package]
name = "app_client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_protocol.workspace = true
glam.workspace = true
# Reads recorded replies and encodes requests to match them, without a hand-written reader.
serde = "1.0.229"
serde_json.workspace = true
kit_base.workspace = true
kit_text.workspace = true
kit_frame.workspace = true
kit_ui.workspace = true
kit_space.workspace = true
kit_fx.workspace = true
kit_scene.workspace = true
kit_probe.workspace = true
game_table.workspace = true
game_play.workspace = true
game_hud.workspace = true
game_manual.workspace = true
game_probe.workspace = true
app_screens.workspace = true
scaffold_web.workspace = true

[dev-dependencies]
# Builds synthetic protocol views and scripts for client tests.
beryl_protocol = { workspace = true, features = ["testing"] }
# The incremental compilation test prepares an already recorded view.
game_play = { workspace = true, features = ["driver"] }
# Supplies face records for tests without linking the engine or cards.
beryl_card_records = { path = "../../../crates/beryl_card_records" }
