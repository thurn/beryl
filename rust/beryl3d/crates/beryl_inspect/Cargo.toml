[package]
name = "beryl_inspect"
version = "0.1.0"
description = "Beryl 3D's inspector: reads a scene and reports it as text, with no GPU"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `just b3d list`, `info`, `tree`, `diff`, `check` and `test`.
[[bin]]
name = "b3d"
path = "src/main.rs"

# One gated board's playback, which `just b3d gate --counts` runs under Callgrind.
[[bin]]
name = "b3d-frame-counts"
path = "src/bin/frame_counts.rs"

[dependencies]
kit_scene.workspace = true
app_client.workspace = true
game_hud.workspace = true
game_play.workspace = true
game_table.workspace = true
kit_frame.workspace = true
kit_probe.workspace = true
kit_ui.workspace = true
game_probe.workspace = true
# The views, scripts and fixture messages a recording holds, with no engine.
beryl_protocol = { path = "../../../crates/beryl_protocol" }
# The recordings pack's file format, in place of a hand-written binary format.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Derives the pack's index types, in place of hand-written serializers.
serde = { version = "1.0.229", features = ["derive"] }
# A recording's messages hold JSON values, which postcard cannot read back, so each is kept in
# the pack as JSON text, in place of a schema of its own.
serde_json = "1.0.154"
# Deflates each recording in the pack, whose views repeat, in place of a format of our own.
miniz_oxide = "0.8.9"

# Times one host frame of the gated boards old against new, with the main workspace's ABBA
# harness compiled in by path.
[[bench]]
name = "frame_abba"
harness = false

# The ABBA harness's request for the fastest cores (`beryl_bench::cores`), which sets the
# thread's scheduling class through libc on macOS.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2.191"

[dev-dependencies]
kit_base.workspace = true
# Opens repository files and records each read, so Ignite reruns the tests when one changes.
beryl_test_files = { path = "../../../crates/beryl_test_files" }
# The points on screen the pointer tests press and drag to, the vector type the client's
# input already takes, in place of a point type of the tests' own.
glam = "0.34.3"
