[package]
name = "beryl_inspect"
version = "0.1.0"
description = "Beryl 3D's inspector: reads a scene and reports it as text, with no GPU"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `just b3d list`, `info`, `tree`, `diff` and `check`.
[[bin]]
name = "b3d"
path = "src/main.rs"

[dependencies]
beryl_scene = { path = "../beryl_scene", features = ["driver"] }
# The views, scripts and fixture messages a recording holds, with no engine.
beryl_protocol = { path = "../../../crates/beryl_protocol" }
# The recordings pack's file format, in place of a hand-written binary format.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Derives the pack's index types, in place of hand-written serializers.
serde = { version = "1.0.229", features = ["derive"] }
# A recording's messages hold JSON values, which postcard cannot read back, so each is kept in
# the pack as JSON text, in place of a schema of its own.
serde_json = "1.0.154"
# Deflates each recording in the pack, whose views repeat, in place of a format of our own.
miniz_oxide = "0.8.9"

# Counts the gated boards' frames under Callgrind (benches/frame_counts.rs), as the main
# workspace's count benchmarks do, in place of a Valgrind harness of our own.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "frame_counts"
harness = false
