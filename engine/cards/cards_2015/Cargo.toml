[package]
name = "cards_2015"
version = "0.1.0"
description = "The cards first printed in the sets of the group cards_2015"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"
# A card file has no tests or doctests: its scenarios run in beryl_cards'
# tests. An empty test binary per crate still cost a link and a launch.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# The vocabulary alone, so that no rules edit rebuilds a card, and what card
# files share, which depends on nothing else either.
beryl_card = { path = "../../crates/beryl_card" }
beryl_card_shared = { path = "../../crates/beryl_card_shared" }
beryl_scenario_types = { path = "../../crates/beryl_scenario_types", optional = true }

[build-dependencies]
beryl_card_build = { path = "../../crates/beryl_card_build" }

[dev-dependencies]
# The crate with its scenarios, and every shared dependency with the whole
# workspace's features, so that a build of this crate alone builds what the
# whole workspace's does (beryl_workspace_hack).
cards_2015 = { path = ".", features = ["scenarios"] }
beryl_workspace_hack = { path = "../../crates/beryl_workspace_hack" }

[features]
# The cards' scenarios, which tests and tools compile and the app never does.
scenarios = ["dep:beryl_scenario_types"]
