[package]
name = "beryl_scenario"
version = "0.1.0"
description = "Card scenarios: the strict runner and the JSON dump"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_card = { path = "../beryl_card" }
beryl_engine = { path = "../beryl_engine" }
# The value types, which card crates name without the rules.
beryl_scenario_types = { path = "../beryl_scenario_types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
