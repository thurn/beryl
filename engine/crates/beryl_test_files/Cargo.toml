[package]
name = "beryl_test_files"
version = "0.1.0"
description = "Opens repository files for tests and records the reads for Ignite's input hashes"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# None: tests take this crate as a dev-dependency, so the kernel, rules and card crates keep no
# runtime dependency, and the client's workspace takes it by path.
[dependencies]

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
