[package]
name = "beryl_rules"
version = "0.1.0"
description = "The rules: turns, priority, casting, mana, combat, layers, triggers and the interpreter of effect data"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_card = { path = "../beryl_card" }
beryl_kernel = { path = "../beryl_kernel" }

[dev-dependencies]
# Opens repository files and records each read, so Ignite reruns the tests when one changes.
beryl_test_files = { path = "../beryl_test_files" }
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
