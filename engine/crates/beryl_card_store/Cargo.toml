[package]
name = "beryl_card_store"
version = "0.1.0"
description = "The card store: a record for every card in the pool, looked up without a scan"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Reads a found record's JSON into types, in place of a hand-written JSON parser.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
