[package]
name = "beryl_engine"
version = "0.1.0"
description = "The facade other crates import: the rules and the kernel under one name"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
beryl_kernel = { path = "../beryl_kernel" }
beryl_rules = { path = "../beryl_rules" }

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
