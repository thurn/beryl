# Written by `just workspace-hack` (tools/src/beryl_tools/workspace_hack.py), which says why
# this crate exists. Do not edit.

[package]
name = "beryl_workspace_hack"
version = "0.1.0"
description = "Every shared dependency with the whole workspace's features, for builds of a subset"
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc", "default", "simd-unsafe", "std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
crc32fast = { version = "1.5.4", default-features = false, features = ["default", "std"] }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc", "default", "std"] }
der = { version = "0.8.3", default-features = false, features = ["alloc", "oid", "pem", "std", "zeroize"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["alloc", "block2", "default", "libc", "objc2", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["any_impl", "any_zlib", "default", "miniz_oxide", "runtime_detection", "rust_backend", "zlib-rs"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std", "sys_rng"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
http = { version = "1.5.0", default-features = false, features = ["default", "std"] }
httparse = { version = "1.10.1", default-features = false, features = ["default", "std"] }
libc = { version = "0.2.191", default-features = false, features = ["default", "extra_traits", "std"] }
memchr = { version = "2.8.3", default-features = false, features = ["alloc", "default", "std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["default", "std"] }
once_cell = { version = "1.21.4", default-features = false, features = ["alloc", "default", "race", "std"] }
percent-encoding = { version = "2.3.2", default-features = false, features = ["alloc", "default", "std"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["default", "proc-macro"] }
quote = { version = "1.0.47", default-features = false, features = ["default", "proc-macro"] }
rand = { version = "0.10.3", default-features = false, features = ["alloc", "default", "std", "std_rng", "sys_rng", "thread_rng"] }
regex-syntax = { version = "0.8.11", default-features = false, features = ["default", "std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["alloc", "default", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "default", "derive", "rc", "serde_derive", "std"] }
serde_core = { version = "1.0.229", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["default", "float_roundtrip", "std"] }
smallvec = { version = "1.16.4", default-features = false, features = ["const_generics", "const_new"] }
syn_2_0_119 = { package = "syn", version = "2.0.119", default-features = false, features = ["clone-impls", "default", "derive", "extra-traits", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
syn_3_0_9 = { package = "syn", version = "3.0.9", default-features = false, features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit"] }
url = { version = "2.5.8", default-features = false, features = ["default", "serde", "std"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc", "default", "derive", "zeroize_derive"] }

