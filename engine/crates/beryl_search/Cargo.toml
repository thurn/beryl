[package]
name = "beryl_search"
version = "0.1.0"
description = "The agents behind one trait: random, greedy and the rollout policy, and the searchers after them"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The card names its heuristics use, rather than `beryl_cards`, so that an edit to a card file
# does not recompile the search.
beryl_card_names = { path = "../beryl_card_names" }
beryl_engine = { path = "../beryl_engine" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# The cards and decklists the tests play, with their scenarios, as the whole workspace builds
# it, so that a build of this package's tests alone reuses the whole workspace's build.
beryl_cards = { path = "../beryl_cards", features = ["scenarios"] }
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
beryl_scenario = { path = "../beryl_scenario" }
# Shrinks a failing fuzz game to the few choices that break it, where a failure was a whole
# game of hundreds of decisions; only the tests use it, never the search itself.
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }

[[test]]
name = "allocations"
harness = false
