[package]
name = "beryl_scenario_types"
version = "0.1.0"
description = "Scenario value types: what a card file writes, naming the vocabulary alone"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The vocabulary, and nothing else: a card crate's scenarios must not rebuild on a rules edit
#.
beryl_card = { path = "../beryl_card" }

[dev-dependencies]
# Every shared dependency with the whole workspace's features, so that a build of this
# package's tests alone builds what the whole workspace's does (beryl_workspace_hack).
beryl_workspace_hack = { path = "../beryl_workspace_hack" }
